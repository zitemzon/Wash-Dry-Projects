$('#modal').addEventListener('click',async e=>{
  if(modalKind!=='projects') return;
  const cf=e.target.closest('[data-cf]');
  if(cf){
    const c=pmState.confirm; pmState.confirm=null; renderConfirm(); if(!c) return;
    if(cf.dataset.cf==='save'){ await saveProject({}); if(!dirty()) c.next(); else toast('ยังบันทึกไม่สำเร็จ จึงยังไม่ดำเนินการต่อ',3500); }
    else if(cf.dataset.cf==='discard') c.next();
    return;
  }
  const pm=e.target.closest('[data-pm]');
  if(pm){
    const a=pm.dataset.pm;
    if(a==='close') return closeModal();
    if(a==='save'){ await saveProject({}); renderProjects(); return; }
    if(a==='saveas'){ pmState.saveAs=true; renderSaveAs(); return; }
    if(a==='saveascancel'){ pmState.saveAs=false; renderSaveAs(); return; }
    if(a==='saveasok'){ const n=($('#pmNewName').value||'').trim()||'โปรเจคใหม่'; pmState.saveAs=false; renderSaveAs(); await saveProject({asNew:true,name:n}); renderProjects(); return; }
    if(a==='newblank') return guardDirty('สร้างโปรเจคใหม่',()=>{ startDraft(blank(S.shopW,S.shopL,'โปรเจคใหม่'),'เริ่มโปรเจคใหม่ (ขนาดร้านเท่าเดิม) — กดบันทึกเพื่อเก็บ'); closeModal(); });
    if(a==='newsample') return guardDirty('เปิดแบบตัวอย่าง',()=>{ startDraft(sample(),'เปิดแบบตัวอย่างแล้ว'); closeModal(); });
    if(a==='dlfile') return downloadProjectFile();
    if(a==='openfile') return guardDirty('เปิดไฟล์',()=>{ const f=$('#fileIn'); f.value=''; f.click(); });
    if(a==='json') return openJson();
    return;
  }
  const pa=e.target.closest('[data-pa]'); if(!pa) return;
  const li=pa.closest('[data-pid]'); if(!li) return;
  const id=li.dataset.pid, st=li.dataset.st, act=pa.dataset.pa;
  const m=listOf(st).find(x=>x.id===id); if(!m) return;
  if(act!=='del'&&pmState.delArm){ pmState.delArm=null; }
  if(act==='open'){
    const isCur=cur.id===id&&cur.storage===st;
    return guardDirty(isCur?'เปิดเวอร์ชันที่บันทึกไว้':'เปิดโปรเจคอื่น',async()=>{ pmState.busy=st+':'+id; renderProjects(); const ok=await openProject(st,id); pmState.busy=null; if(ok) closeModal(); else renderProjects(); });
  }
  if(act==='rename'){ pmState.renaming={id,st}; return renderProjects(); }
  if(act==='renamecancel'){ pmState.renaming=null; return renderProjects(); }
  if(act==='renameok'){
    const n=($('#pmRename').value||'').trim(); pmState.renaming=null;
    if(!n||n===m.name){ return renderProjects(); }
    try{
      if(st==='cloud'&&!cloudWritable()) throw {code:'invalid_argument'};
      const rev=await storeRename(st,id,n);
      if(cur.id===id&&cur.storage===st){ const wasDirty=dirty(); S.name=n; lsSet(KEY,JSON.stringify(S)); syncHeader(); cur.rev=rev; if(!wasDirty) cur.savedHash=contentHash(); persistCur(); }
      toast('เปลี่ยนชื่อโปรเจคแล้ว');
    }catch(err){ toast(errText(err),4000); }
    updateStatus(); return renderProjects();
  }
  if(act==='dup'||act==='upload'){
    const target=act==='upload'?'cloud':(st==='cloud'&&cloudWritable()?'cloud':'local');
    pmState.busy=st+':'+id; renderProjects();
    try{
      const state=await storeGet(st,id); if(!state) throw {code:'missing'};
      if(act==='dup') state.name=(state.name||'โปรเจค')+' (สำเนา)';
      const nid=act==='upload'?id:('p'+uid()+uid().slice(0,4));
      const rev=uid(); myRevs.add(rev);
      await storePut(target,nid,makeMeta(target,state,act==='upload'?m:null,rev),state);
      if(act==='upload'){
        await storeDel('local',id);
        if(cur.id===id&&cur.storage==='local'){ cur.storage='cloud'; cur.rev=rev; persistCur(); }
        toast('ย้ายโปรเจคขึ้นคลาวด์แล้ว');
      }else toast(`ทำสำเนาเป็น “${state.name}” แล้ว`);
    }catch(err){ toast(err&&err.code==='missing'?'ไม่พบข้อมูลแบบของโปรเจคนี้':errText(err),4000); }
    pmState.busy=null; updateStatus(); return renderProjects();
  }
  if(act==='del'){
    if(!(pmState.delArm&&pmState.delArm.id===id&&pmState.delArm.st===st)){
      pmState.delArm={id,st}; renderProjects();
      setTimeout(()=>{ if(pmState.delArm&&pmState.delArm.id===id){ pmState.delArm=null; renderProjects(); } },4000);
      return;
    }
    pmState.delArm=null;
    try{
      if(st==='cloud'&&!cloudWritable()) throw {code:'invalid_argument'};
      if(cur.id===id&&cur.storage===st){ cur={id:null,storage:null,rev:null,savedHash:null,savedAt:null,baseHash:null}; persistCur(); }
      await storeDel(st,id);
      toast(`ลบโปรเจค “${m.name||''}” แล้ว`);
    }catch(err){ toast(errText(err),4000); }
    updateStatus(); return renderProjects();
  }
});

/* ---------- files (downloads capability → fallback คัดลอก JSON) ---------- */
let dlP=null;
function getDownloads(){
  if(!dlP){ const c=window.claude; dlP=(c&&typeof c.use==='function')?c.use('downloads').catch(()=>null):Promise.resolve(null); }
  return dlP;
}
function safeFile(n){ return (String(n||'').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,'-').trim().slice(0,80))||'laundry-layout'; }
function exportObj(){ return {app:'washdry-layout',v:1,exportedAt:new Date().toISOString(),state:S}; }
async function downloadProjectFile(){
  const dl=await getDownloads();
  if(!dl){ openJson(); return; }
  try{ await dl.save({filename:safeFile(S.name)+'.json',data:JSON.stringify(exportObj(),null,1)}); toast('บันทึกไฟล์โปรเจคแล้ว'); }
  catch(e){ const c=e&&e.code; if(c==='declined') return; if(c==='rate_limited'){ toast('มีหน้าต่างบันทึกไฟล์เปิดอยู่แล้ว'); return; } openJson(); }
}
function parseProjectText(txt){
  const o=JSON.parse(txt); const st=o&&o.state&&o.app==='washdry-layout'?o.state:o;
  if(!valid(st)) throw new Error('shape');
  return normalize(st);
}
$('#fileIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{ const st=parseProjectText(String(rd.result)); startDraft(st,`เปิดไฟล์ “${f.name}” แล้ว — กดบันทึกเพื่อเก็บเป็นโปรเจค`); closeModal(); }
    catch(err){ toast('อ่านไฟล์ไม่ได้ ต้องเป็นไฟล์ .json ที่ส่งออกจากโปรแกรมนี้',4000); }
  };
  rd.onerror=()=>toast('อ่านไฟล์ไม่สำเร็จ');
  rd.readAsText(f);
});

function openJson(){
  openModal('คัดลอก / วาง JSON ของแบบ',
    `<p class="note">คัดลอก JSON ด้านล่างไปเก็บ (เช่น Google Drive / LINE Keep) หรือวาง JSON ที่เคยคัดลอกไว้แล้วกด “เปิดจาก JSON ที่วาง” — แบบที่เปิดจะเป็นแบบร่าง กดบันทึกเพื่อเก็บเป็นโปรเจค</p>
     <textarea id="jsonTxt" spellcheck="false">${esc(JSON.stringify(exportObj(),null,1))}</textarea><p class="note" id="jsonMsg"></p>`,
    `<button class="btn" type="button" id="jCopy">คัดลอก JSON</button><button class="btn" type="button" id="jLoad">เปิดจาก JSON ที่วาง</button><button class="btn" type="button" id="jClose">ปิด</button>`,'json');
  $('#jClose').onclick=closeModal;
  $('#jCopy').onclick=()=>{ const ta=$('#jsonTxt'); const ok=()=>toast('คัดลอก JSON แล้ว');
    const fallback=()=>{ ta.select(); $('#jsonMsg').textContent='เบราว์เซอร์ไม่อนุญาตให้คัดลอกอัตโนมัติ ข้อความถูกเลือกไว้แล้ว กด Ctrl+C / ⌘C'; };
    try{ navigator.clipboard.writeText(ta.value).then(ok,fallback); }catch(err){ fallback(); } };
  $('#jLoad').onclick=()=>{
    try{ const st=parseProjectText($('#jsonTxt').value);
      if(dirty()&&!$('#jLoad').dataset.armed){ $('#jLoad').dataset.armed='1'; $('#jLoad').textContent='ยืนยัน: แทนที่แบบปัจจุบันที่ยังไม่บันทึก'; $('#jLoad').classList.add('danger','armed'); return; }
      startDraft(st,'เปิดแบบจาก JSON แล้ว — กดบันทึกเพื่อเก็บเป็นโปรเจค'); closeModal();
    }catch(err){ $('#jsonMsg').textContent='อ่าน JSON ไม่ได้ ตรวจสอบว่าวางข้อความครบทั้งหมด (ต้องมี shopW, shopL, zones, items)'; }
  };
}

/* =========================================================
   15) PNG export
   ========================================================= */
function resolveVars(str){
  const cs=getComputedStyle(document.documentElement);
  return str.replace(/var\((--[a-z0-9-]+)\)/gi,(m,n)=>(cs.getPropertyValue(n).trim()||'#000').replace(/"/g,"'"));
}
function exportPNG(){
  const W=S.shopW,L=S.shopL, padL=76,padT=56,padR=140,padB=90, foot=96, target=1500;
  const s=Math.min(target/W,target/L), cw=Math.round(W*s+padL+padR), ch=Math.round(L*s+padT+padB+foot);
  const {c:by,pockets}=countsOf(S);
  const d=new Date(), ds=`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()+543}`;
  const line1=`${S.name||'แบบผังร้าน'} · ขนาด ${dimsShort(W,L)} cm (${fmtArea(W*L)}) · ${ds}`;
  const line2=`ซัก ${by.washer} · อบ ${by.dryer} · Stack ${by.stack} · ถังบริการ ${pockets} · ชำระเงิน ${by.coin} · อื่นๆ ${by.furn} · CCTV ${by.cctv} จุด · หน่วยระยะ cm (ต่ำกว่า 1 cm แสดงเป็น mm)`;
  const y0=L*s+padT+padB;
  let body=buildPlan({s,tx:padL,ty:padT},{exporting:true});
  body+=`<line x1="24" y1="${y0}" x2="${cw-24}" y2="${y0}" style="stroke:var(--line)" stroke-width="1"/>`;
  body+=`<text x="24" y="${y0+34}" font-size="18" style="fill:var(--ink);font-family:var(--f-ui);font-weight:600">${esc(line1)}</text>`;
  body+=`<text x="24" y="${y0+64}" font-size="14" style="fill:var(--muted);font-family:var(--f-ui)">${esc(line2)}</text>`;
  let str=`<svg xmlns="http://www.w3.org/2000/svg" width="${cw}" height="${ch}" viewBox="0 0 ${cw} ${ch}"><rect x="0" y="0" width="${cw}" height="${ch}" style="fill:var(--panel)"/>${body}</svg>`;
  str=resolveVars(str);
  const img=new Image();
  img.onload=()=>{
    const k=2, c=document.createElement('canvas'); c.width=cw*k; c.height=ch*k;
    const ctx=c.getContext('2d'); ctx.scale(k,k); ctx.drawImage(img,0,0);
    let url=''; try{ url=c.toDataURL('image/png'); }catch(err){}
    openModal('ภาพแบบผัง (PNG)',
      `<p class="note">กด “บันทึกไฟล์ PNG” หรือคลิกขวาที่ภาพแล้วเลือก “บันทึกรูปภาพ” (มือถือ: กดค้างที่ภาพ) · กดคัดลอกเพื่อวางลง LINE / เอกสาร</p><img id="pngImg" alt="แบบผังร้าน" src="${url||('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str))}"><p class="note" id="pngMsg"></p>`,
      `<button class="btn" type="button" id="pSave" hidden>บันทึกไฟล์ PNG</button><button class="btn" type="button" id="pCopy">คัดลอกภาพ</button><button class="btn" type="button" id="pClose">ปิด</button>`,'png');
    $('#pClose').onclick=closeModal;
    getDownloads().then(dl=>{
      const b=$('#pSave'); if(!dl||!b||!url) return; b.hidden=false;
      b.onclick=()=>{ c.toBlob(async blob=>{ if(!blob) return; try{ await dl.save({filename:safeFile(S.name)+'.png',data:blob}); toast('บันทึกไฟล์ PNG แล้ว'); }catch(e2){ if(e2&&e2.code!=='declined') $('#pngMsg').textContent='บันทึกไฟล์ไม่ได้ ใช้คลิกขวา/กดค้างที่ภาพแทน'; } },'image/png'); };
    });
    $('#pCopy').onclick=()=>{
      const fail=()=>{ $('#pngMsg').textContent='เบราว์เซอร์นี้ไม่อนุญาตคัดลอกภาพ ใช้คลิกขวา/กดค้างที่ภาพแทน'; };
      try{ c.toBlob(b=>{ try{ navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(()=>toast('คัดลอกภาพแล้ว'),fail); }catch(e3){ fail(); } },'image/png'); }
      catch(err){ fail(); }
    };
  };
  img.onerror=()=>toast('สร้างภาพไม่สำเร็จ');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);
}

/* =========================================================
   16) Wiring
   ========================================================= */
function commitName(){
  const v=$('#planName').value;
  if(v!==S.name) mutate(()=>{ S.name=v; });
}
function wire(){
  $('#libList').addEventListener('click',e=>{
    const p=e.target.closest('[data-p]'); if(p){ addFromPreset(PRE[p.dataset.p]); return; }
    if(e.target.id==='cAdd'){
      const kind=$('#cKind').value;
      const cm=id=>{ const v=parseFloat($(id).value); return isFinite(v)?v:0; };
      const w=Math.max(10,mmFromCm(cm('#cW'))), d=Math.max(10,mmFromCm(cm('#cD')));
      addFromPreset({kind,brand:$('#cBrand').value.trim(),model:$('#cModel').value.trim()||'กำหนดเอง',name:$('#cModel').value.trim()||KIND[kind].label,
        w,d,h:Math.max(0,mmFromCm(cm('#cH'))),units:Math.max(1,parseInt($('#cU').value)||1),clear:Math.max(0,mmFromCm(cm('#cC'))),src:'approx',cap:''});
    }
    if(e.target.id==='zAdd'){
      const cm=id=>{ const v=parseFloat($(id).value); return isFinite(v)?v:100; };
      const w=Math.max(100,mmFromCm(cm('#zW'))), l=Math.max(100,mmFromCm(cm('#zL')));
      mutate(()=>{ const z={id:uid(),name:$('#zName').value.trim()||'โซน',x:0,y:0,w,l,color:ZCOL[S.zones.length%ZCOL.length],locked:false}; S.zones.push(z); sel=z.id; });
    }
  });
  const gapHint=()=>{ $('#aGapHint').textContent=unitHint(gapMM()); };
  $('#aGap').addEventListener('input',gapHint); gapHint();

  const ins=$('#inspector');
  ins.addEventListener('input',onField);
  ins.addEventListener('focusin',()=>{ insSnap=snapStr(); });
  ins.addEventListener('change',()=>{ if(insSnap&&insSnap!==snapStr()){ pushHist(insSnap); insSnap=snapStr(); updUndo(); } });
  ins.addEventListener('click',onInspAct);
  $('#summary').addEventListener('click',e=>{ const t=e.target.closest('[data-sel]'); if(t&&findAny(t.dataset.sel)){ sel=t.dataset.sel; renderAll(); } });

  $('#planName').addEventListener('change',commitName);
  $('#planName').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); commitName(); e.target.blur(); } });
  const shopChange=()=>{ const w=parseFloat($('#shopW').value), l=parseFloat($('#shopL').value);
    if(!(w>=100&&w<=10000&&l>=100&&l<=10000)){ toast('ขนาดร้านต้องอยู่ระหว่าง 100–10,000 cm'); syncHeader(); return; }
    mutate(()=>{ S.shopW=mmFromCm(w); S.shopL=mmFromCm(l); }); syncHeader(); fit(); };
  $('#shopW').addEventListener('change',shopChange); $('#shopL').addEventListener('change',shopChange);
  $('#gridSel').addEventListener('change',e=>mutate(()=>{ S.grid=+e.target.value; }));
  $('#snapSel').addEventListener('change',e=>mutate(()=>{ S.snap=+e.target.value; }));
  [['oClear','showClear'],['oFov','showFov'],['oAll','showAll'],['oMag','magnet'],['oLbl','showLbl']].forEach(([id,k])=>{
    $('#'+id).addEventListener('change',e=>{ S[k]=e.target.checked; save(); renderPlan(); });
  });
  $('#oAuto').checked=autoOn;
  $('#oAuto').addEventListener('change',e=>{ autoOn=e.target.checked; lsSet(AKEY,autoOn?'1':'0'); if(autoOn) scheduleAutosave(); else clearTimeout(autoT); });
  $('#bSave').onclick=()=>{ if(document.activeElement===$('#planName')) commitName(); saveProject({}); };
  $('#bProjects').onclick=openProjects;
  $('#tSelect').onclick=()=>setMode('select');
  $('#tMeasure').onclick=()=>setMode(mode==='measure'?'select':'measure');
  $('#tUndo').onclick=undo; $('#tRedo').onclick=redo;
  $('#tFit').onclick=fit;
  $('#tZi').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,1.25);
  $('#tZo').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,1/1.25);
  $('#bPng').onclick=exportPNG;
  let first=true;
  new ResizeObserver(()=>{ if(first){ first=false; fit(); } else renderPlan(); }).observe($('#svgWrap'));
}

/* ---------- boot ---------- */
const boot=load();
S=boot.state;
try{ const c=JSON.parse(lsGet(CKEY)||'null'); if(c&&typeof c==='object'&&'id' in c) cur=Object.assign(cur,c); }catch(e){}
if(!lsGet(CKEY)&&boot.fresh) cur.baseHash=contentHash();   // แบบตัวอย่างครั้งแรก = แบบร่างที่ยังไม่ถูกแก้
if(cur.rev) myRevs.add(cur.rev);
renderLibrary(); syncHeader(); wire(); renderAll(); updateStatus();
requestAnimationFrame(fit);
initCloud();
})();
</script>
