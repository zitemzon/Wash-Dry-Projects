<title>ผังร้านสะดวกซัก 2D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: drafting-table app — library rail | plan sheet on a cool stage | inspector + schedule rail */
:root{
  --bg:#E9EDEC; --panel:#FAFBFA; --stage:#DFE5E4; --floor:#FFFFFF;
  --ink:#16212A; --muted:#5A6770; --line:#CFD7D6; --wall:#16212A;
  --grid-minor:#E6EBEC; --grid-major:#C2CDD1;
  --accent:#2747C9; --on-accent:#FFFFFF; --dim:#2747C9;
  --bad:#CF2338; --warn:#B87800; --ok:#1E7A4C;
  --c-washer:#16739B; --t-washer:#DCEEF6;
  --c-dryer:#BC5F0C; --t-dryer:#FBE8D3;
  --c-stack:#6F43B8; --t-stack:#ECE3F9;
  --c-coin:#1E7A4C; --t-coin:#DAF1E3;
  --c-furn:#5F6B74; --t-furn:#E8ECEE;
  --c-cctv:#CF2338; --t-cctv:#FBE0E3;
  --z1:#16739B; --z2:#BC5F0C; --z3:#1E7A4C; --z4:#6F43B8; --z5:#9A6B00; --z6:#5F6B74;
  --f-display:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-ui:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:9px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101519; --panel:#181F24; --stage:#0C1013; --floor:#151C21;
  --ink:#E4EBEE; --muted:#93A1AA; --line:#2A353C; --wall:#D9E2E6;
  --grid-minor:#1F282E; --grid-major:#33414A;
  --accent:#7D95FF; --on-accent:#0C1013; --dim:#8EA3FF;
  --bad:#FF5C6E; --warn:#F2B53A; --ok:#5CC48A;
  --c-washer:#55B6DD; --t-washer:#12313E;
  --c-dryer:#F2A055; --t-dryer:#382614;
  --c-stack:#B593F2; --t-stack:#281F3C;
  --c-coin:#5CC48A; --t-coin:#14301F;
  --c-furn:#A3AFB8; --t-furn:#232B31;
  --c-cctv:#FF5C6E; --t-cctv:#3A161C;
  --z1:#55B6DD; --z2:#F2A055; --z3:#5CC48A; --z4:#B593F2; --z5:#E3C04F; --z6:#A3AFB8;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101519; --panel:#181F24; --stage:#0C1013; --floor:#151C21;
  --ink:#E4EBEE; --muted:#93A1AA; --line:#2A353C; --wall:#D9E2E6;
  --grid-minor:#1F282E; --grid-major:#33414A;
  --accent:#7D95FF; --on-accent:#0C1013; --dim:#8EA3FF;
  --bad:#FF5C6E; --warn:#F2B53A; --ok:#5CC48A;
  --c-washer:#55B6DD; --t-washer:#12313E;
  --c-dryer:#F2A055; --t-dryer:#382614;
  --c-stack:#B593F2; --t-stack:#281F3C;
  --c-coin:#5CC48A; --t-coin:#14301F;
  --c-furn:#A3AFB8; --t-furn:#232B31;
  --c-cctv:#FF5C6E; --t-cctv:#3A161C;
  --z1:#55B6DD; --z2:#F2A055; --z3:#5CC48A; --z4:#B593F2; --z5:#E3C04F; --z6:#A3AFB8;
  color-scheme:dark;
}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  display:flex;flex-direction:column;padding-inline:16px;min-height:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.01em;margin:0;white-space:nowrap}
.brand h1 b{color:var(--accent);font-weight:600}
#planName{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 8px;min-width:0;width:15em;max-width:100%;font-weight:500}
#planName:focus{border-color:var(--accent);outline:none}
.saveg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.state{display:inline-grid;line-height:1.2;font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel);min-width:0}
.state small{font-size:10.5px;color:var(--muted)}
.state.ok span{color:var(--ok)}
.state.warn span{color:var(--warn)}
.state.bad span{color:var(--bad)}
.state.busy span{color:var(--accent)}
.hgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.hgroup .lbl{font-size:12px;color:var(--muted);letter-spacing:.02em}
.num{width:5.6em;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 7px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 6px}
.area-pill{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.on,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--floor)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px;padding:8px 12px;border:1px solid var(--warn);border-left-width:4px;border-radius:8px;background:var(--panel);font-size:13px}
.banner .t{flex:1;min-width:12em}

/* ---------- main grid ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:288px minmax(0,1fr) 340px;gap:12px;padding-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;min-height:0;min-width:0}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:0;min-width:0;display:flex;flex-direction:column}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel)}
.tools .sep{width:1px;height:22px;background:var(--line);margin-inline:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:4px 8px;border:1px solid var(--line);border-radius:99px;cursor:pointer;user-select:none;background:var(--panel)}
.chip input{margin:0;accent-color:var(--accent)}
#svgWrap{position:relative;flex:1;min-height:0}
#plan{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#plan.measure{cursor:crosshair}
#plan.panning{cursor:grabbing}
.status{display:flex;flex-wrap:wrap;gap:4px 16px;padding:6px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel)}
.status b{color:var(--ink);font-weight:500}

/* ---------- panels ---------- */
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec>summary,.sec-h{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:600;font-size:13.5px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.sec[open]>summary::after{transform:rotate(45deg)}
.sec-h{cursor:default}
.sec-b{padding:0 14px 14px;display:grid;gap:8px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.addopts{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:10px 14px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.addopts label{display:grid;gap:2px;font-size:11.5px;color:var(--muted)}
.addopts .num,.addopts .sel{width:100%}
.hint{font-size:10.5px;color:var(--warn);font-family:var(--f-mono)}
.preset{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:start;column-gap:9px;row-gap:1px;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--floor);border-radius:8px;padding:8px 9px;cursor:pointer}
.preset:hover{border-color:var(--accent)}
.preset .dot{margin-top:5px;grid-row:span 3}
.preset .pn{font-weight:600;font-size:13px;min-width:0}
.preset .pn small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.preset .pd{grid-column:2;font-size:11.5px}
.preset .pm{grid-column:2;font-size:11px;color:var(--muted)}
.preset .padd{grid-row:1;grid-column:3;font-family:var(--f-mono);font-size:16px;line-height:1;color:var(--accent);padding:2px 4px}
.src{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:99px;border:1px solid var(--line);margin-left:4px}
.src.spec{color:var(--ok);border-color:currentColor}
.src.retail{color:var(--accent);border-color:currentColor}
.src.approx{color:var(--warn);border-color:currentColor}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.form label{display:grid;gap:2px;font-size:11.5px;color:var(--muted)}
.form .full{grid-column:1/-1}
.form input,.form select{width:100%;border:1px solid var(--line);background:var(--floor);border-radius:6px;padding:5px 7px}
.form input[type=number]{font-family:var(--f-mono)}

/* inspector */
#inspector{padding:12px 14px 14px;display:grid;gap:10px}
.insp-h{display:flex;align-items:center;gap:8px}
.insp-h .k{font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:grid;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.fld.full{grid-column:1/-1}
.fld .in{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--floor);overflow:hidden}
.fld .in:focus-within{border-color:var(--accent)}
.fld input,.fld select{border:0;background:transparent;padding:6px 8px;width:100%;min-width:0;color:var(--ink)}
.fld input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fld input:focus,.fld select:focus{outline:none}
.fld em{font-style:normal;font-size:11px;padding-right:8px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.fld em.mmx{color:var(--warn)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .btn{flex:1;padding:5px 6px;font-size:12.5px}
.swatches{display:flex;gap:6px}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}
.empty{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
.empty kbd,.keys kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--floor)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted);margin-top:4px}
.readout{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* summary */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--floor)}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500;line-height:1.1}
.kpi .l{font-size:11.5px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl td,.tbl th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.sub td{color:var(--muted);font-size:12px;padding-left:22px;border-bottom-style:dashed}
.tbl tr.tot td{font-weight:600;border-bottom:0}
.kcell{display:flex;align-items:center;gap:7px}
.issues{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.issues li{font-size:12.5px;padding:6px 8px;border-radius:6px;border-left:3px solid var(--warn);background:var(--floor);cursor:pointer}
.issues li.bad{border-left-color:var(--bad)}
.issues li.okk{border-left-color:var(--ok);cursor:default}
.olist{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.olist li{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.olist li:hover{background:var(--bg)}
.olist li.on{background:var(--accent);color:var(--on-accent)}
.olist li .m{margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.8;white-space:nowrap}
.ogroup{font-size:11px;color:var(--muted);font-weight:600;margin-top:6px;letter-spacing:.03em}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,18,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal .mh{padding:12px 16px;font-weight:600;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:16px}
.modal .mb{padding:14px 16px;overflow:auto;display:grid;gap:10px}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.modal textarea{width:100%;min-height:260px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--floor);padding:10px;resize:vertical}
.modal img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;pointer-events:none;max-width:calc(100% - 32px)}

/* project manager */
.pm-actions{display:flex;flex-wrap:wrap;gap:6px}
.pm-box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--floor);display:grid;gap:8px}
.pm-box.warnbox{border-color:var(--warn);border-left-width:4px}
.pm-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pm-row input[type=text]{flex:1;min-width:10em;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px}
.pm-tier{font-size:12px;color:var(--muted)}
.pm-tier b{color:var(--ink);font-weight:600}
#pmSearch{width:100%;border:1px solid var(--line);background:var(--floor);border-radius:6px;padding:6px 9px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--floor);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.plist li.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.plist .pname{font-weight:600;overflow-wrap:anywhere}
.plist .pmeta{grid-column:1;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.plist .pwho{grid-column:1;font-size:11.5px;color:var(--muted)}
.plist .pacts{grid-row:1/span 3;grid-column:2;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:17em}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--on-accent);margin-left:6px;vertical-align:1px;font-weight:500}
.pempty{font-size:12.5px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:8px}

@media (max-width:1180px){
  html,body{height:auto}
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stage{grid-column:1/-1;order:-1;height:72vh;min-height:420px}
  .panel{max-height:none}
}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr)}
  #right{order:0} #library{order:1}
  .stage{height:68vh}
  .brand h1{font-size:18px}
  #planName{width:100%}
  .plist li{grid-template-columns:minmax(0,1fr)}
  .plist .pacts{grid-row:auto;grid-column:1;justify-content:flex-start;max-width:none}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<header class="top">
  <div class="brand">
    <h1>ผังร้าน<b>สะดวกซัก</b> 2D</h1>
    <input id="planName" aria-label="ชื่อโปรเจค" placeholder="ชื่อโปรเจค" value="">
    <div class="saveg">
      <span id="saveState" class="state" role="status" aria-live="polite"><span>–</span><small>&nbsp;</small></span>
      <button class="btn primary" id="bSave" type="button" title="บันทึกโปรเจค (Ctrl+S)">บันทึก</button>
      <label class="chip" title="บันทึกโปรเจคอัตโนมัติ 3 วินาทีหลังแก้ไข"><input type="checkbox" id="oAuto">อัตโนมัติ</label>
      <button class="btn" id="bProjects" type="button">โปรเจคทั้งหมด</button>
    </div>
  </div>
  <div class="hgroup" role="group" aria-label="ขนาดร้าน">
    <span class="lbl">ขนาดร้าน กว้าง</span>
    <input id="shopW" class="num" type="number" step="any" min="100" max="10000" inputmode="decimal" aria-label="กว้าง (cm)">
    <span class="lbl">× ลึก</span>
    <input id="shopL" class="num" type="number" step="any" min="100" max="10000" inputmode="decimal" aria-label="ลึก (cm)">
    <span class="lbl">cm</span>
    <span id="shopArea" class="area-pill">0 m²</span>
  </div>
  <div class="hgroup">
    <span class="lbl">กริด</span>
    <select id="gridSel" class="sel" aria-label="ระยะเส้นกริด">
      <option value="100">10 cm</option><option value="250">25 cm</option><option value="500">50 cm</option><option value="1000">100 cm</option>
    </select>
    <span class="lbl">Snap</span>
    <select id="snapSel" class="sel" aria-label="ระยะ snap">
      <option value="1">ปิด (1 mm)</option><option value="10">1 cm</option><option value="50">5 cm</option><option value="100">10 cm</option><option value="250">25 cm</option><option value="500">50 cm</option>
    </select>
  </div>
  <div class="spacer"></div>
  <div class="hgroup">
    <button class="btn" id="bPng" type="button">ภาพ PNG</button>
  </div>
</header>
<div id="banner" class="banner" role="alert" hidden></div>

<main class="main">
  <!-- library -->
  <aside class="panel" id="library" aria-label="คลังเครื่องและอุปกรณ์">
    <div class="addopts">
      <label>จำนวนที่เพิ่ม<input id="aQty" class="num" type="number" min="1" max="40" value="1" inputmode="numeric"></label>
      <label>ระยะห่างระหว่างเครื่อง (cm)<input id="aGap" class="num" type="number" min="0" step="any" value="2" inputmode="decimal"><span class="hint" id="aGapHint"></span></label>
      <label>เรียงต่อกันทาง<select id="aDir" class="sel"><option value="x">แนวนอน (→)</option><option value="y">แนวตั้ง (↓)</option></select></label>
      <label>หน้าเครื่องหันไปทาง<select id="aRot" class="sel"><option value="0">ลง ↓</option><option value="90">ซ้าย ←</option><option value="180">ขึ้น ↑</option><option value="270">ขวา →</option></select></label>
    </div>
    <div id="libList"></div>
  </aside>

  <!-- stage -->
  <section class="stage" aria-label="แบบผังร้าน">
    <div class="tools">

(function(){

   ข้อมูลภายในเก็บเป็น mm (จำนวนเต็ม) เสมอ — แสดงผลเป็น cm,
   และค่าที่ต่ำกว่า 1 cm แสดงเป็น mm
   ========================================================= */
const KEY='washdry-layout-v1';          // แบบที่กำลังแก้ไข (working copy)
const PKEY='washdry-projects-v1';       // โปรเจคที่บันทึกในเบราว์เซอร์
const CKEY='washdry-current-v1';        // โปรเจคที่เปิดอยู่
const AKEY='washdry-autosave';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v);
const clone=o=>JSON.parse(JSON.stringify(o));
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };

/* ---------- หน่วย ---------- */
// ระยะ/ขนาด: ≥ 1 cm → cm (ทศนิยมสูงสุด 1 ตำแหน่ง), < 1 cm → mm
function fmtLen(mm,unit){
  const u=unit!==false, a=Math.abs(+mm||0), sg=(+mm<0&&a>=.5)?'-':'';
  if(a<10) return sg+Math.round(a)+(u?' mm':'');
  return sg+(a/10).toLocaleString('en-US',{maximumFractionDigits:1})+(u?' cm':'');
}
// ขนาดคู่ เช่น 68.6×87.5 — ถ้ามีค่าใดต่ำกว่า 1 cm ใส่หน่วยทุกค่า
function dimsShort(...v){ return v.every(x=>Math.abs(x)>=10)?v.map(x=>fmtLen(x,false)).join('×'):v.map(x=>fmtLen(x)).join('×'); }
function fmtDims(...v){ v=v.filter(x=>x>0); return v.every(x=>x>=10)?v.map(x=>fmtLen(x,false)).join(' × ')+' cm':v.map(x=>fmtLen(x)).join(' × '); }
const fmtArea=mm2=>(mm2/1e6).toFixed(2)+' m²';
const cmVal=mm=>+(mm/10).toFixed(1);           // ค่าในช่องกรอก (cm)
const mmFromCm=v=>Math.round(v*10);
function unitHint(mm){ return (mm>0&&mm<10)?`= ${Math.round(mm)} mm`:''; }
function fmtTime(iso){
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return '';
  const today=new Date().toDateString()===d.toDateString();
  return today?d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})
              :d.toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ขนาด W×D×H (mm) อ้างอิงจาก spec sheet ผู้ผลิต / ข้อมูลตัวแทนจำหน่าย — ตรวจสอบรุ่นที่สั่งจริงก่อนติดตั้ง */
const PRESETS=[

  {g:'เครื่องหยอดเหรียญ / ชำระเงิน',id:'g-chg',  brand:'ทั่วไป',kind:'coin',name:'ตู้แลกเหรียญ',model:'Coin Changer ตั้งพื้น',w:450,d:380,h:1500,units:1,clear:600,src:'approx'},

  {g:'เครื่องหยอดเหรียญ / ชำระเงิน',id:'g-cbox', brand:'ทั่วไป',kind:'coin',name:'กล่องหยอดเหรียญตั้งพื้น',model:'Coin Box Stand',w:350,d:300,h:1100,units:1,clear:500,src:'approx'},

  {g:'เฟอร์นิเจอร์ & อุปกรณ์',id:'f-vend',  brand:'ทั่วไป',kind:'furn',name:'ตู้ขายน้ำยา',model:'Vending ผงซักฟอก/น้ำยา',w:900,d:800,h:1830,clear:600,src:'approx'},
  {g:'เฟอร์นิเจอร์ & อุปกรณ์',id:'f-table', brand:'ทั่วไป',kind:'furn',name:'โต๊ะพับผ้า',model:'Folding Table',w:1800,d:600,h:850,clear:0,src:'approx'},

  {g:'เฟอร์นิเจอร์ & อุปกรณ์',id:'f-sink',  brand:'ทั่วไป',kind:'furn',name:'อ่างล้าง',model:'Sink',w:600,d:500,h:850,clear:0,src:'approx'},
  {g:'เฟอร์นิเจอร์ & อุปกรณ์',id:'f-tank',  brand:'ทั่วไป',kind:'furn',name:'ถังน้ำ / ปั๊ม',model:'Water Tank',w:800,d:800,h:1200,clear:0,src:'approx'},
  {g:'เฟอร์นิเจอร์ & อุปกรณ์',id:'f-col',   brand:'ทั่วไป',kind:'furn',name:'เสา',model:'Column',w:300,d:300,h:0,clear:0,src:'approx'},
  {g:'เฟอร์นิเจอร์ & อุปกรณ์',id:'f-door',  brand:'ทั่วไป',kind:'furn',name:'ประตูทางเข้า',model:'Door opening',w:1800,d:100,h:0,clear:0,src:'approx'},

  {g:'กล้องวงจรปิด CCTV',id:'c-dome',  brand:'CCTV',kind:'cctv',name:'Dome 2.8 mm',model:'Dome 2.8 mm',fov:100,range:8000},
  {g:'กล้องวงจรปิด CCTV',id:'c-b4',    brand:'CCTV',kind:'cctv',name:'Bullet 4 mm',model:'Bullet 4 mm',fov:85,range:12000},
  {g:'กล้องวงจรปิด CCTV',id:'c-b6',    brand:'CCTV',kind:'cctv',name:'Bullet 6 mm',model:'Bullet 6 mm',fov:55,range:18000},
  {g:'กล้องวงจรปิด CCTV',id:'c-fish',  brand:'CCTV',kind:'cctv',name:'Fisheye 360°',model:'Fisheye 360°',fov:360,range:6000}
];
const PRE=Object.fromEntries(PRESETS.map(p=>[p.id,p]));

/* =========================================================
   2) State + geometry helpers
   ========================================================= */
let S=null;
let view={s:.06,tx:60,ty:60};
let sel=null, mode='select', measure=null, drag=null, insSnap=null;
let hist=[], redoStack=[];
let A={flags:{},cflag:{},issues:[]};
const pointers=new Map(); let pinch=null;

const isCam=o=>o&&o.kind==='cctv';
const bw=it=>(it.rot%180===0)?it.w:it.d;
const bh=it=>(it.rot%180===0)?it.d:it.w;
const box=it=>({x1:it.x,y1:it.y,x2:it.x+bw(it),y2:it.y+bh(it)});
function clearBox(it){
  if(!it.clear) return null; const b=box(it), c=it.clear;
  switch(it.rot){
    case 0:  return {x1:b.x1,y1:b.y2,x2:b.x2,y2:b.y2+c};
    case 90: return {x1:b.x1-c,y1:b.y1,x2:b.x1,y2:b.y2};
    case 180:return {x1:b.x1,y1:b.y1-c,x2:b.x2,y2:b.y1};
    default: return {x1:b.x2,y1:b.y1,x2:b.x2+c,y2:b.y2};
  }
}
const ov=(a,b)=>a.x1<b.x2-.5&&b.x1<a.x2-.5&&a.y1<b.y2-.5&&b.y1<a.y2-.5;
const outside=b=>b.x1<-.5||b.y1<-.5||b.x2>S.shopW+.5||b.y2>S.shopL+.5;
const solids=()=>S.items.filter(i=>!isCam(i));
const findAny=id=>S.items.find(i=>i.id===id)||S.zones.find(z=>z.id===id)||null;
const isZone=o=>o&&('l' in o)&&!('kind' in o);

function nextName(kind,items){
  const pre=KIND[kind].pre; let mx=0; const re=new RegExp('^'+pre+'(\\d+)$');
  items.forEach(i=>{const m=re.exec(i.name||''); if(m) mx=Math.max(mx,+m[1]);});
  return pre+String(mx+1).padStart(2,'0');
}
function baseName(base,items){
  if(!items.some(i=>i.name===base)) return base;
  let k=2; while(items.some(i=>i.name===base+' '+k)) k++; return base+' '+k;
}
function makeItem(p,rot,items){
  if(p.kind==='cctv') return {id:uid(),kind:'cctv',brand:'',model:p.model,name:nextName('cctv',items),x:0,y:0,angle:45,fov:p.fov,range:p.range,mountH:2800};
  const named=(p.kind==='furn')?baseName(p.name,items):nextName(p.kind,items);
  return {id:uid(),kind:p.kind,brand:p.brand,model:p.model,name:named,w:p.w,d:p.d,h:p.h||0,cap:p.cap||'',units:p.units||1,clear:p.clear||0,rot:rot||0,x:0,y:0,src:p.src||'approx'};
}

/* ---------- ตัวอย่างเริ่มต้น (ข้อมูลสมมติ) ---------- */
function blank(w,l,name){
  return {v:1,name:name||'โปรเจคใหม่',shopW:w||6000,shopL:l||11000,grid:500,snap:50,
    magnet:true,showClear:true,showFov:true,showAll:false,showLbl:true,zones:[],items:[]};
}
function sample(){
  const T=blank(6000,11000,'ตัวอย่าง – ร้าน 600 × 1,100 cm');
  const Z=(name,x,y,w,l,color)=>T.zones.push({id:uid(),name,x,y,w,l,color,locked:true});
  Z('โซนเครื่องอบ',0,0,6000,2200,'z2');
  Z('โซนเครื่องซัก / โต๊ะพับผ้า',0,2200,6000,4600,'z1');
  Z('โซนนั่งรอ',0,6800,6000,2000,'z3');
  Z('ทางเข้า / ชำระเงิน',0,8800,6000,2200,'z5');
  const add=(pid,x,y,rot)=>{const it=makeItem(PRE[pid],rot,T.items); it.x=x; it.y=y; T.items.push(it); return it;};
  for(let i=0;i<4;i++) add('sq-stt30',1370+i*820,0,0);
  for(let i=0;i<6;i++) add('ss-wf20',0,2300+i*706,270);
  for(let i=0;i<6;i++) add('sq-fl27',6000-704,2300+i*703,90);
  add('f-table',2700,3500,90);
  add('f-bench',0,7000,270);
  add('f-vend',0,9300,270);
  add('g-chg',5620,8800,90);
  add('g-kiosk',5550,9500,90);
  add('f-door',2100,10900,0);
  const cam=(pid,x,y,a,range)=>{const c=add(pid,x,y,0); c.angle=a; if(range) c.range=range;};
  cam('c-dome',150,150,50,9000);
  cam('c-dome',5850,150,130,9000);
  cam('c-b4',3000,10850,270,12000);
  cam('c-dome',5850,10850,220,5000);
  return T;
}

function valid(o){
  return !!o&&typeof o==='object'&&isFinite(o.shopW)&&isFinite(o.shopL)&&+o.shopW>0&&+o.shopL>0&&Array.isArray(o.items)&&Array.isArray(o.zones);
}
function normalize(o){
  const d=blank();
  ['grid','snap','magnet','showClear','showFov','showAll','showLbl','name'].forEach(k=>{if(o[k]===undefined) o[k]=d[k];});
  o.v=1; o.shopW=r1(+o.shopW); o.shopL=r1(+o.shopL);
  o.items=o.items.filter(i=>i&&typeof i==='object'&&KIND[i.kind]);
  o.zones=o.zones.filter(z=>z&&typeof z==='object');
  o.items.forEach(i=>{
    if(!i.id) i.id=uid(); i.x=+i.x||0; i.y=+i.y||0; i.name=String(i.name??'');
    if(isCam(i)){ i.angle=+i.angle||0; i.fov=+i.fov||90; i.range=+i.range||6000; }
    else { i.rot=[0,90,180,270].includes(+i.rot)?+i.rot:0; i.w=Math.max(10,+i.w||10); i.d=Math.max(10,+i.d||10); i.clear=+i.clear||0; i.units=+i.units||1; }
  });
  o.zones.forEach(z=>{ if(!z.id) z.id=uid(); if(!ZCOL.includes(z.color)) z.color='z1'; z.x=+z.x||0; z.y=+z.y||0; z.w=Math.max(100,+z.w||100); z.l=Math.max(100,+z.l||100); z.name=String(z.name??''); });
  return o;
}
function load(){
  try{ const raw=lsGet(KEY); if(raw){ const o=JSON.parse(raw); if(valid(o)) return {state:normalize(o),fresh:false}; } }catch(e){}
  return {state:sample(),fresh:true};
}

/* ---------- history ---------- */
const snapStr=()=>JSON.stringify(S);
function pushHist(str){ hist.push(str??snapStr()); if(hist.length>100) hist.shift(); redoStack=[]; }
function mutate(fn){ pushHist(); fn(); commit(); }
function commit(){ save(); renderAll(); }
function undo(){ if(!hist.length) return; redoStack.push(snapStr()); S=JSON.parse(hist.pop()); afterLoad(); }
function redo(){ if(!redoStack.length) return; hist.push(snapStr()); S=JSON.parse(redoStack.pop()); afterLoad(); }
function afterLoad(){ if(sel&&!findAny(sel)) sel=null; syncHeader(); commit(); }

/* working copy → localStorage, แล้วอัปเดตสถานะการบันทึกโปรเจค */
function save(){ lsSet(KEY,JSON.stringify(S)); onContentChanged(); }

/* =========================================================
   3) Analysis — ชน / ล้นขอบ / พื้นที่หน้าเครื่องถูกบัง
   ========================================================= */
function analyze(){
  const flags={}, cflag={}, issues=[]; const sol=solids();
  sol.forEach(i=>{ if(outside(box(i))){ flags[i.id]='out'; issues.push({lv:'warn',id:i.id,t:`${i.name} ล้นออกนอกขอบเขตร้าน`}); } });
  for(let a=0;a<sol.length;a++) for(let b=a+1;b<sol.length;b++){
    if(ov(box(sol[a]),box(sol[b]))){ flags[sol[a].id]=flags[sol[b].id]='overlap'; issues.push({lv:'bad',id:sol[a].id,t:`${sol[a].name} ทับกับ ${sol[b].name}`}); }
  }
  sol.forEach(i=>{
    const c=clearBox(i); if(!c) return;
    const hits=sol.filter(j=>j!==i&&ov(c,box(j)));
    if(hits.length){ cflag[i.id]=1; issues.push({lv:'warn',id:i.id,t:`พื้นที่หน้าเครื่อง ${i.name} (${fmtLen(i.clear)}) ถูก ${hits.map(h=>h.name).join(', ')} บัง`}); }
    else if(outside(c)){ cflag[i.id]=1; issues.push({lv:'warn',id:i.id,t:`${i.name} หันหน้าเข้าผนัง / ระยะหน้าเครื่องไม่ถึง ${fmtLen(i.clear)}`}); }
  });
  S.items.filter(isCam).forEach(c=>{ if(c.x<0||c.y<0||c.x>S.shopW||c.y>S.shopL) issues.push({lv:'warn',id:c.id,t:`กล้อง ${c.name} อยู่นอกขอบเขตร้าน`}); });
  return {flags,cflag,issues};
}

/* ระยะห่างจากขอบเครื่องถึงสิ่งกีดขวางที่ใกล้ที่สุด 4 ทิศ */
function gapsOf(it){
  const b=box(it), others=solids().filter(o=>o!==it).map(o=>({o,b:box(o)}));
  const out=[];
  const yOv=ob=>ob.y1<b.y2-.5&&ob.y2>b.y1+.5, xOv=ob=>ob.x1<b.x2-.5&&ob.x2>b.x1+.5;
  const midY=ob=>ob?(Math.max(b.y1,ob.y1)+Math.min(b.y2,ob.y2))/2:(b.y1+b.y2)/2;
  const midX=ob=>ob?(Math.max(b.x1,ob.x1)+Math.min(b.x2,ob.x2))/2:(b.x1+b.x2)/2;
  let r={p:S.shopW,b:null}, l={p:0,b:null}, d={p:S.shopL,b:null}, u={p:0,b:null};
  others.forEach(({b:ob})=>{
    if(yOv(ob)){ if(ob.x1>=b.x2-.5&&ob.x1<r.p) r={p:ob.x1,b:ob}; if(ob.x2<=b.x1+.5&&ob.x2>l.p) l={p:ob.x2,b:ob}; }
    if(xOv(ob)){ if(ob.y1>=b.y2-.5&&ob.y1<d.p) d={p:ob.y1,b:ob}; if(ob.y2<=b.y1+.5&&ob.y2>u.p) u={p:ob.y2,b:ob}; }
  });
  out.push({dir:'r',wall:!r.b,x1:b.x2,y1:midY(r.b),x2:r.p,y2:midY(r.b),len:r.p-b.x2});
  out.push({dir:'l',wall:!l.b,x1:l.p,y1:midY(l.b),x2:b.x1,y2:midY(l.b),len:b.x1-l.p});
  out.push({dir:'d',wall:!d.b,x1:midX(d.b),y1:b.y2,x2:midX(d.b),y2:d.p,len:d.p-b.y2});
  out.push({dir:'u',wall:!u.b,x1:midX(u.b),y1:u.p,x2:midX(u.b),y2:b.y1,len:b.y1-u.p});
  return out;
}

/* =========================================================
   4) SVG rendering (world = mm, view = px/mm)
   ========================================================= */
const svg=$('#plan');
const NS='vector-effect="non-scaling-stroke"';

function dimLine(x1,y1,x2,y2,label,s,col,small,outsideLbl){
  const px=n=>n/s, t=px(4), horiz=Math.abs(x2-x1)>=Math.abs(y2-y1);
  const len=Math.hypot(x2-x1,y2-y1);
  let h=`<g style="pointer-events:none"><g style="stroke:${col}"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${NS} stroke-width="1"/>`;
  h+=`<line x1="${x1-t}" y1="${y1+t}" x2="${x1+t}" y2="${y1-t}" ${NS} stroke-width="1.6"/><line x1="${x2-t}" y1="${y2+t}" x2="${x2+t}" y2="${y2-t}" ${NS} stroke-width="1.6"/>`;
  if(horiz){ h+=`<line x1="${x1}" y1="${y1-t*1.6}" x2="${x1}" y2="${y1+t*1.6}" ${NS} stroke-width="1"/><line x1="${x2}" y1="${y2-t*1.6}" x2="${x2}" y2="${y2+t*1.6}" ${NS} stroke-width="1"/>`; }
  else { h+=`<line x1="${x1-t*1.6}" y1="${y1}" x2="${x1+t*1.6}" y2="${y1}" ${NS} stroke-width="1"/><line x1="${x2-t*1.6}" y1="${y2}" x2="${x2+t*1.6}" y2="${y2}" ${NS} stroke-width="1"/>`; }
  h+='</g>';
  const fs=px(small?9.5:10.5), tw=label.length*fs*.62+px(8), th=fs+px(5);
  let mx=(x1+x2)/2, my=(y1+y2)/2;
  if(horiz&&len<tw) my-=th; if(!horiz&&(len<th*1.2||outsideLbl)) mx+=tw/2+px(4);
  h+=`<rect x="${mx-tw/2}" y="${my-th/2}" width="${tw}" height="${th}" rx="${px(3)}" style="fill:var(--floor);stroke:${col}" stroke-width="1" ${NS}/>`;
  h+=`<text x="${mx}" y="${my}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" style="font-family:var(--f-mono);fill:${col}">${esc(label)}</text></g>`;
  return h;
}

function niceStep(s,target){ const c=[10,20,50,100,200,250,500,1000,2000,2500,5000,10000,20000]; for(const v of c){ if(v*s>=target) return v; } return 50000; }

function itemSVG(it,s,flag){
  const W=it.w, D=it.d, cx=it.x+bw(it)/2, cy=it.y+bh(it)/2, k=it.kind;
  const col=`var(--c-${k})`;
  const stroke=flag==='overlap'?'var(--bad)':flag==='out'?'var(--warn)':col;
  const mn=Math.min(W,D);
  let g=`<g data-id="${it.id}" transform="translate(${cx} ${cy}) rotate(${it.rot})" style="cursor:move">`;
  g+=`<rect x="${-W/2}" y="${-D/2}" width="${W}" height="${D}" rx="${mn*.05}" style="fill:var(--t-${k});stroke:${stroke}" stroke-width="${flag?2.6:1.4}" ${NS}/>`;
  if(k==='washer'){
    g+=`<rect x="${-W/2}" y="${-D/2}" width="${W}" height="${D*.16}" style="fill:${col};fill-opacity:.22"/>`;
    const r=Math.min(W,D*.84)*.34;
    g+=`<circle cx="0" cy="${D*.08}" r="${r}" style="fill:none;stroke:${col}" stroke-width="1.3" ${NS}/><circle cx="0" cy="${D*.08}" r="${r*.55}" style="fill:none;stroke:${col}" stroke-width="1" stroke-dasharray="3 3" ${NS}/>`;
  }else if(k==='dryer'){
    const r=Math.min(W,D*.9)*.37;
    g+=`<rect x="${-W*.3}" y="${-D/2+D*.04}" width="${W*.6}" height="${D*.08}" rx="${D*.02}" style="fill:${col};fill-opacity:.25"/>`;
    g+=`<circle cx="0" cy="${D*.06}" r="${r}" style="fill:none;stroke:${col}" stroke-width="1.3" ${NS}/>`;
    for(let i=-1;i<=1;i++) g+=`<line x1="${-r*.55}" y1="${D*.06+i*r*.35}" x2="${r*.55}" y2="${D*.06+i*r*.35}" style="stroke:${col}" stroke-width="1" ${NS}/>`;
    if(it.units>1) g+=`<line x1="${-W/2}" y1="0" x2="${W/2}" y2="0" style="stroke:${col}" stroke-width="1" stroke-dasharray="5 4" ${NS}/>`;
  }else if(k==='stack'){
    g+=`<line x1="${-W/2}" y1="${-D/2}" x2="${W/2}" y2="${D/2}" style="stroke:${col}" stroke-width="1" ${NS}/><line x1="${W/2}" y1="${-D/2}" x2="${-W/2}" y2="${D/2}" style="stroke:${col}" stroke-width="1" ${NS}/>`;
    g+=`<circle cx="0" cy="0" r="${mn*.3}" style="fill:var(--t-${k});stroke:${col}" stroke-width="1.3" ${NS}/>`;
  }else if(k==='coin'){
    g+=`<circle cx="0" cy="0" r="${mn*.3}" style="fill:none;stroke:${col}" stroke-width="1.3" ${NS}/>`;
    g+=`<text x="0" y="0" font-size="${mn*.36}" text-anchor="middle" dominant-baseline="central" style="fill:${col};font-family:var(--f-ui);font-weight:600">฿</text>`;
  }else{
    const ins=mn*.08; g+=`<rect x="${-W/2+ins}" y="${-D/2+ins}" width="${Math.max(0,W-2*ins)}" height="${Math.max(0,D-2*ins)}" style="fill:none;stroke:${col};stroke-opacity:.5" stroke-width="1" stroke-dasharray="4 3" ${NS}/>`;
  }
  if(it.clear>0||k!=='furn') g+=`<line x1="${-W/2+mn*.06}" y1="${D/2}" x2="${W/2-mn*.06}" y2="${D/2}" style="stroke:${stroke}" stroke-width="3.5" stroke-linecap="round" ${NS}/>`;
  g+='</g>';
  return g;
}

function camSVG(c,s,selected){
  let h=`<g data-id="${c.id}" transform="translate(${c.x} ${c.y}) scale(${1/s})" style="cursor:move">`;
  h+=`<circle r="15" style="fill:var(--floor);stroke:${selected?'var(--accent)':'var(--c-cctv)'}" stroke-width="${selected?3:2}"/>`;
  h+=`<g transform="rotate(${c.fov>=360?0:c.angle})"><rect x="-9" y="-5.5" width="12" height="11" rx="2" style="fill:var(--c-cctv)"/><path d="M3 -3 L10 -7 L10 7 L3 3 Z" style="fill:var(--c-cctv)"/>${c.fov>=360?'<circle cx="0" cy="0" r="3" style="fill:var(--floor)"/>':''}</g>`;
  h+=`<rect x="10" y="-27" width="${String(c.name).length*7+10}" height="15" rx="4" style="fill:var(--c-cctv)"/><text x="15" y="-19.5" font-size="10.5" dominant-baseline="central" style="fill:var(--floor);font-family:var(--f-mono);font-weight:500">${esc(c.name)}</text>`;
  h+='</g>';
  return h;
}

function fovPath(c){
  if(c.fov>=360) return `<circle cx="${c.x}" cy="${c.y}" r="${c.range}"`;
  const a1=(c.angle-c.fov/2)*Math.PI/180, a2=(c.angle+c.fov/2)*Math.PI/180, r=c.range;
  const x1=c.x+r*Math.cos(a1), y1=c.y+r*Math.sin(a1), x2=c.x+r*Math.cos(a2), y2=c.y+r*Math.sin(a2);
  return `<path d="M${c.x} ${c.y} L${x1} ${y1} A${r} ${r} 0 ${c.fov>180?1:0} 1 ${x2} ${y2} Z"`;
}

function buildPlan(v,opt){
  const o=opt||{}, s=v.s, px=n=>n/s, W=S.shopW, L=S.shopL, ex=!!o.exporting, X=ex?'X':'';
  let h=`<defs><clipPath id="shopClip${X}"><rect x="0" y="0" width="${W}" height="${L}"/></clipPath>`+
        `<pattern id="hatch${X}" patternUnits="userSpaceOnUse" width="${px(7)}" height="${px(7)}" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="${px(7)}" style="stroke:var(--muted);stroke-opacity:.45" stroke-width="${px(1)}"/></pattern></defs>`;
  h+=`<g transform="translate(${v.tx} ${v.ty}) scale(${s})">`;
  h+=`<rect x="0" y="0" width="${W}" height="${L}" style="fill:var(--floor)"/>`;

  // zones (fill)
  S.zones.forEach(z=>{ h+=`<rect data-id="${z.id}" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.l}" style="fill:var(--${z.color});fill-opacity:.11;cursor:${z.locked?'default':'move'}"/>`; });

  // grid
  const g=S.grid; let mi='', ma='';
  if(g*s>=5){ for(let x=g;x<W;x+=g) if(x%1000) mi+=`M${x} 0V${L}`; for(let y=g;y<L;y+=g) if(y%1000) mi+=`M0 ${y}H${W}`; }
  for(let x=1000;x<W;x+=1000) ma+=`M${x} 0V${L}`; for(let y=1000;y<L;y+=1000) ma+=`M0 ${y}H${W}`;
  if(mi) h+=`<path d="${mi}" style="stroke:var(--grid-minor);pointer-events:none" stroke-width="1" ${NS} fill="none"/>`;
  if(ma) h+=`<path d="${ma}" style="stroke:var(--grid-major);pointer-events:none" stroke-width="1" ${NS} fill="none"/>`;

  // zone borders
  S.zones.forEach(z=>{
    const zs=sel===z.id&&!ex;
    h+=`<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.l}" style="fill:none;stroke:var(--${z.color});pointer-events:none" stroke-width="${zs?2.2:1.3}" stroke-dasharray="${zs?'':'7 4'}" ${NS}/>`;
  });

  // clearance
  if(S.showClear){
    solids().forEach(it=>{ const c=clearBox(it); if(!c) return; const bad=A.cflag[it.id];
      h+=`<rect x="${c.x1}" y="${c.y1}" width="${c.x2-c.x1}" height="${c.y2-c.y1}" style="fill:var(--c-${it.kind});fill-opacity:.06;pointer-events:none"/>`;
      h+=`<rect x="${c.x1}" y="${c.y1}" width="${c.x2-c.x1}" height="${c.y2-c.y1}" style="fill:url(#hatch${X});stroke:${bad?'var(--warn)':'var(--c-'+it.kind+')'};stroke-opacity:${bad?1:.5};pointer-events:none" stroke-width="${bad?1.6:1}" stroke-dasharray="4 3" ${NS}/>`;
    });
  }

  // FOV
  const cams=S.items.filter(isCam);
  if(S.showFov){
    h+=`<g clip-path="url(#shopClip${X})" style="pointer-events:none">`;
    cams.forEach(c=>{ h+=fovPath(c)+` style="fill:var(--c-cctv);fill-opacity:${sel===c.id&&!ex?.15:.045};stroke:var(--c-cctv);stroke-opacity:.55" stroke-width="1" stroke-dasharray="5 4" ${NS}/>`; });
    h+='</g>';
  }

  // items
  solids().forEach(it=>{ h+=itemSVG(it,s,A.flags[it.id]); });

  // item labels (ชื่อ + ขนาด cm)
  if(S.showLbl){
    solids().forEach(it=>{
      const cx=it.x+bw(it)/2, cy=it.y+bh(it)/2, sw=bw(it)*s, sh=bh(it)*s;
      if(sw<16||sh<12) return;
      const fs=Math.min(12,Math.max(8,Math.min(sw,sh)/4.2));
      const showD=sw>=44&&sh>=34;
      h+=`<text x="${cx}" y="${cy-(showD?px(5):0)}" font-size="${px(fs)}" text-anchor="middle" dominant-baseline="central" style="fill:var(--ink);font-family:var(--f-ui);font-weight:600;paint-order:stroke;stroke:var(--t-${it.kind});stroke-width:${px(3)};pointer-events:none">${esc(it.name)}</text>`;
      if(showD) h+=`<text x="${cx}" y="${cy+px(fs*.75)}" font-size="${px(Math.max(8,fs-2.5))}" text-anchor="middle" dominant-baseline="central" style="fill:var(--muted);font-family:var(--f-mono);paint-order:stroke;stroke:var(--t-${it.kind});stroke-width:${px(3)};pointer-events:none">${dimsShort(it.w,it.d)}</text>`;
    });
  }

  // zone labels (above machines, with halo)
  S.zones.forEach(z=>{
    if(!(z.w*s>60&&z.l*s>30)) return;
    const halo=`paint-order:stroke;stroke:var(--floor);stroke-width:${px(3.5)};stroke-linejoin:round;pointer-events:none`;
    h+=`<text x="${z.x+z.w/2}" y="${z.y+z.l-px(22)}" font-size="${px(12)}" text-anchor="middle" style="fill:var(--${z.color});font-family:var(--f-ui);font-weight:600;${halo}">${esc(z.name)}</text>`;
    h+=`<text x="${z.x+z.w/2}" y="${z.y+z.l-px(8)}" font-size="${px(10)}" text-anchor="middle" style="fill:var(--${z.color});font-family:var(--f-mono);${halo}">${dimsShort(z.w,z.l)} cm = ${fmtArea(z.w*z.l)}</text>`;
  });

  // walls
  h+=`<rect x="0" y="0" width="${W}" height="${L}" style="fill:none;stroke:var(--wall);pointer-events:none" stroke-width="3.5" ${NS}/>`;

  // rulers (top/left) in cm
  const st=niceStep(s,ex?46:34), fsR=px(10);
  for(let x=0;x<=W+.1;x+=st){ h+=`<line x1="${x}" y1="${-px(6)}" x2="${x}" y2="0" style="stroke:var(--muted)" stroke-width="1" ${NS}/><text x="${x}" y="${-px(10)}" font-size="${fsR}" text-anchor="middle" style="fill:var(--muted);font-family:var(--f-mono)">${fmtLen(x,false)}</text>`; }
  for(let y=0;y<=L+.1;y+=st){ h+=`<line x1="${-px(6)}" y1="${y}" x2="0" y2="${y}" style="stroke:var(--muted)" stroke-width="1" ${NS}/><text x="${-px(9)}" y="${y}" font-size="${fsR}" text-anchor="end" dominant-baseline="central" style="fill:var(--muted);font-family:var(--f-mono)">${fmtLen(y,false)}</text>`; }
  h+=`<text x="${-px(9)}" y="${-px(10)}" font-size="${fsR}" text-anchor="end" style="fill:var(--muted);font-family:var(--f-mono)">cm</text>`;

  // overall dims (bottom/right)
  h+=dimLine(0,L+px(26),W,L+px(26),`กว้าง ${fmtLen(W)}`,s,'var(--ink)');
  h+=dimLine(W+px(26),0,W+px(26),L,`ลึก ${fmtLen(L)}`,s,'var(--ink)',false,true);

  // gap dims
  if(S.showAll){
    solids().forEach(it=>{ gapsOf(it).forEach(gp=>{
      if(gp.len<=.5) return; if((gp.dir==='l'||gp.dir==='u')&&!gp.wall) return;
      h+=dimLine(gp.x1,gp.y1,gp.x2,gp.y2,fmtLen(gp.len),s,'var(--dim)',true);
    }); });
  }
  const so=!ex&&sel?findAny(sel):null;
  if(so&&!isZone(so)&&!isCam(so)){
    const b=box(so);
    h+=`<rect x="${b.x1-px(4)}" y="${b.y1-px(4)}" width="${b.x2-b.x1+px(8)}" height="${b.y2-b.y1+px(8)}" style="fill:none;stroke:var(--accent);pointer-events:none" stroke-width="1.6" stroke-dasharray="5 3" ${NS}/>`;
    if(!S.showAll) gapsOf(so).forEach(gp=>{ if(gp.len>.5) h+=dimLine(gp.x1,gp.y1,gp.x2,gp.y2,fmtLen(gp.len),s,'var(--dim)'); });
  }
  if(so&&isZone(so)&&!so.locked){
    h+=`<rect data-id="${so.id}" data-handle="resize" x="${so.x+so.w-px(7)}" y="${so.y+so.l-px(7)}" width="${px(14)}" height="${px(14)}" rx="${px(3)}" style="fill:var(--accent);stroke:var(--floor);cursor:nwse-resize" stroke-width="2" ${NS}/>`;
  }

  // cameras
  cams.forEach(c=>{ h+=camSVG(c,s,sel===c.id&&!ex); });
  if(so&&isCam(so)&&so.fov<360){
    const a=so.angle*Math.PI/180, hx=so.x+so.range*Math.cos(a), hy=so.y+so.range*Math.sin(a);
    h+=`<line x1="${so.x}" y1="${so.y}" x2="${hx}" y2="${hy}" style="stroke:var(--accent);pointer-events:none" stroke-width="1" stroke-dasharray="3 3" ${NS}/>`;
    h+=`<circle data-id="${so.id}" data-handle="aim" cx="${hx}" cy="${hy}" r="${px(8)}" style="fill:var(--accent);stroke:var(--floor);cursor:grab" stroke-width="2" ${NS}/>`;
  }

  // measure
  if(measure&&!ex){
    const len=Math.hypot(measure.b.x-measure.a.x,measure.b.y-measure.a.y);
    if(len>.5) h+=dimLine(measure.a.x,measure.a.y,measure.b.x,measure.b.y,fmtLen(len),s,'var(--bad)');
  }
  h+='</g>';
  return h;
}

function scaleBar(cw,ch){
  const s=view.s, len=niceStep(s,90), w=len*s, x=16, y=ch-18;
  return `<g style="pointer-events:none"><rect x="${x-6}" y="${y-20}" width="${w+12}" height="30" rx="5" style="fill:var(--panel);fill-opacity:.9"/>`+
    `<rect x="${x}" y="${y}" width="${w/2}" height="5" style="fill:var(--ink)"/><rect x="${x+w/2}" y="${y}" width="${w/2}" height="5" style="fill:var(--floor);stroke:var(--ink)" stroke-width="1"/>`+
    `<text x="${x}" y="${y-6}" font-size="10.5" style="fill:var(--ink);font-family:var(--f-mono)">0</text><text x="${x+w}" y="${y-6}" font-size="10.5" text-anchor="end" style="fill:var(--ink);font-family:var(--f-mono)">${fmtLen(len)}</text></g>`;
}

function renderPlan(){
  A=analyze();
  const cw=svg.clientWidth, ch=svg.clientHeight;
  svg.innerHTML=buildPlan(view,{})+scaleBar(cw,ch);
  const mmpx=1/view.s;
  $('#stScale').textContent=`1 px = ${mmpx>=10?(mmpx/10).toFixed(2)+' cm':mmpx.toFixed(1)+' mm'}`;
}

/* =========================================================
   5) Library panel
   ========================================================= */
function presetBtn(p){
  const dims=p.kind==='cctv'?`FOV ${p.fov}° · ระยะ ${fmtLen(p.range)}`:fmtDims(p.w,p.d,p.h);
  const meta=p.kind==='cctv'?'มุมมอง/ระยะปรับได้':`${p.cap?esc(p.cap)+' · ':''}${KIND[p.kind].label.split(' ')[0]}<span class="src ${p.src}">${SRC[p.src]}</span>`;
  return `<button type="button" class="preset" data-p="${p.id}" title="เพิ่ม ${esc(p.name)}"><span class="dot" style="background:var(--c-${p.kind})"></span><span class="pn">${esc(p.name)}<small>${esc(p.model)}</small></span><span class="padd" aria-hidden="true">+</span><span class="pd mono">${dims}</span><span class="pm">${meta}</span></button>`;
}
function renderLibrary(){
  const groups={}; PRESETS.forEach(p=>(groups[p.g]=groups[p.g]||[]).push(p));
  const openG=['Speed Queen','Samsung Commercial'];
  let h='';
  Object.keys(groups).forEach(g=>{
    h+=`<details class="sec" ${openG.includes(g)?'open':''}><summary>${esc(g)}</summary><div class="sec-b">${groups[g].map(presetBtn).join('')}</div></details>`;
  });
  h+=`<details class="sec"><summary>เพิ่มเครื่อง / วัตถุ กำหนดเอง</summary><div class="sec-b"><div class="form" id="customForm">
    <label class="full">ประเภท<select id="cKind">${KORDER.filter(k=>k!=='cctv').map(k=>`<option value="${k}">${KIND[k].label}</option>`).join('')}</select></label>

function findFree(w,h){
  const sol=solids().map(box), st=100;
  for(let y=0;y<=S.shopL-h;y+=st) for(let x=0;x<=S.shopW-w;x+=st){
    const b={x1:x,y1:y,x2:x+w,y2:y+h}; if(!sol.some(o=>ov(o,b))) return {x,y};
  }
  return {x:Math.max(0,r1((S.shopW-w)/2)),y:Math.max(0,r1((S.shopL-h)/2))};
}
function freeCamSpot(){
  const W=S.shopW,L=S.shopL, spots=[[150,150,45],[W-150,150,135],[W-150,L-150,225],[150,L-150,315],[W/2,150,90],[W/2,L-150,270]];
  const cams=S.items.filter(isCam);
  for(const [x,y,a] of spots) if(!cams.some(c=>Math.hypot(c.x-x,c.y-y)<300)) return {x,y,a};
  return {x:W/2,y:L/2,a:0};
}
function gapMM(){ const v=parseFloat($('#aGap').value); return isFinite(v)?Math.max(0,mmFromCm(v)):0; }
function addFromPreset(p){
  const qty=clamp(parseInt($('#aQty').value)||1,1,40), gap=gapMM();
  const dir=$('#aDir').value, rot=+$('#aRot').value;
  mutate(()=>{
    const made=[];
    for(let i=0;i<qty;i++){
      const it=makeItem(p,rot,S.items);
      if(isCam(it)){ const f=freeCamSpot(); it.x=f.x; it.y=f.y; it.angle=f.a; S.items.push(it); made.push(it); continue; }
      if(!made.length){ const f=findFree(bw(it),bh(it)); it.x=f.x; it.y=f.y; }
      else { const pv=made[made.length-1]; if(dir==='x'){ it.x=pv.x+bw(pv)+gap; it.y=pv.y; } else { it.x=pv.x; it.y=pv.y+bh(pv)+gap; } }
      S.items.push(it); made.push(it);
    }
    sel=made[0].id;
  });
  toast(`เพิ่ม ${p.name} ${qty>1?'× '+qty:''} แล้ว`);
}

function setUnitSuffix(input,mm){
  const em=input&&input.nextElementSibling; if(!em||em.tagName!=='EM'||input.dataset.scale!=='10') return;

  if(isZone(o)){ set('x',o.x); set('y',o.y); set('w',o.w); set('l',o.l); }
  else if(isCam(o)){ set('x',o.x); set('y',o.y); set('angle',o.angle); set('range',o.range); }
  else { set('x',o.x); set('y',o.y); }

function onField(e){
  const t=e.target, f=t.dataset.f; if(!f) return; const o=sel?findAny(sel):null; if(!o) return;
  if(t.type==='number'){
    let v=parseFloat(t.value); if(!isFinite(v)) return; v*=(+t.dataset.scale||1);
    if(f==='w'||f==='d'||f==='l') v=Math.max(10,v);
    if(f==='h'||f==='clear'||f==='mountH') v=Math.max(0,v);
    if(f==='units') v=Math.max(1,v);
    if(f==='fov') v=clamp(v,5,360);
    if(f==='range') v=Math.max(100,v);
    if(f==='angle') v=((v%360)+360)%360;
    o[f]=Math.round(v);
    setUnitSuffix(t,o[f]);
  }else{
    o[f]=t.value;
    if(f==='kind') { save(); renderAll(); return; }
  }
  save(); renderPlan(); renderSummary(); updateReadout();
}
function onInspAct(e){
  const b=e.target.closest('[data-act]'); if(!b) return; const o=sel?findAny(sel):null; if(!o) return;
  const act=b.dataset.act;
  if(act==='del') return delSel();
  if(act==='dup') return dupSel();
  mutate(()=>{
    if(act==='rot') setRot(o,+b.dataset.v);
    if(act==='color') o.color=b.dataset.v;
    if(act==='lock') o.locked=!o.locked;
  });
}

   9) View: fit / zoom
   ========================================================= */
function fit(){
  const cw=svg.clientWidth, ch=svg.clientHeight; if(!cw||!ch) return;
  const padL=56, padT=34, padR=104, padB=64;
  const s=Math.min((cw-padL-padR)/S.shopW,(ch-padT-padB)/S.shopL);
  view.s=clamp(s,.004,3);
  view.tx=padL+((cw-padL-padR)-S.shopW*view.s)/2;
  view.ty=padT+((ch-padT-padB)-S.shopL*view.s)/2;
  renderPlan();
}
function zoomAt(sx,sy,f){
  const ns=clamp(view.s*f,.004,3), wx=(sx-view.tx)/view.s, wy=(sy-view.ty)/view.s;
  view.s=ns; view.tx=sx-wx*ns; view.ty=sy-wy*ns; renderPlan();
}

function local(e){ const r=svg.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function toWorld(e){ const p=local(e); return {x:(p.x-view.tx)/view.s,y:(p.y-view.ty)/view.s}; }
const snapV=v=>{const st=S.snap||1; return Math.round(v/st)*st;};

function magnet(o,nx,ny,w,h){
  if(!S.magnet) return {x:nx,y:ny};
  const tol=9/view.s; let xs=[0,S.shopW], ys=[0,S.shopL];
  solids().forEach(i=>{ if(i===o) return; const b=box(i); xs.push(b.x1,b.x2); ys.push(b.y1,b.y2); });
  let bx=null,bd=tol, by=null,bdy=tol;
  xs.forEach(c=>{ let d=Math.abs(nx-c); if(d<bd){bd=d;bx=c;} d=Math.abs(nx+w-c); if(d<bd){bd=d;bx=c-w;} });
  ys.forEach(c=>{ let d=Math.abs(ny-c); if(d<bdy){bdy=d;by=c;} d=Math.abs(ny+h-c); if(d<bdy){bdy=d;by=c-h;} });
  return {x:bx??nx,y:by??ny};
}

svg.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button>1) return;
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,local(e));
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s}; drag=null; return;
  }
  const w=toWorld(e);
  if(e.button===1){ drag={type:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty}; svg.classList.add('panning'); return; }
  if(mode==='measure'){ const p={x:snapV(w.x),y:snapV(w.y)}; measure={a:p,b:{...p}}; drag={type:'measure'}; renderPlan(); return; }
  const t=e.target.closest('[data-id]');
  if(t){
    const id=t.dataset.id, hd=t.dataset.handle, o=findAny(id);
    if(!o){ return; }
    const changed=sel!==id; sel=id;
    const before=snapStr();
    if(hd==='aim') drag={type:'aim',o,snap:before};
    else if(hd==='resize') drag={type:'resize',o,snap:before};
    else if(isZone(o)&&o.locked) drag={type:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty,click:true};
    else drag={type:'move',o,ox:w.x-o.x,oy:w.y-o.y,snap:before,moved:false};
    if(changed) renderAll(); else renderPlan();
  }else{
    if(sel){ sel=null; renderAll(); }
    drag={type:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty};
  }
  if(drag&&drag.type==='pan') svg.classList.add('panning');
});

svg.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,local(e));
  const w=toWorld(e);
  $('#stPos').textContent=`X ${fmtLen(w.x)} · Y ${fmtLen(w.y)}`;
  if(pinch&&pointers.size===2){
    const [a,b]=[...pointers.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt((a.x+b.x)/2,(a.y+b.y)/2,(pinch.s*d/pinch.d)/view.s); return;
  }
  if(!drag) return;
  if(drag.type==='pan'){ view.tx=drag.tx+(e.clientX-drag.sx); view.ty=drag.ty+(e.clientY-drag.sy); renderPlan(); return; }
  if(drag.type==='measure'){
    let b={x:snapV(w.x),y:snapV(w.y)};
    if(e.shiftKey){ if(Math.abs(b.x-measure.a.x)>Math.abs(b.y-measure.a.y)) b.y=measure.a.y; else b.x=measure.a.x; }
    measure.b=b; renderPlan(); return;
  }
  const o=drag.o;
  if(!drag.moved&&drag.snap){ pushHist(drag.snap); drag.moved=true; }
  if(drag.type==='move'){
    let nx=snapV(w.x-drag.ox), ny=snapV(w.y-drag.oy);
    if(isCam(o)){ o.x=r1(nx); o.y=r1(ny); }
    else if(isZone(o)){ const m=magnet(null,nx,ny,o.w,o.l); o.x=r1(m.x); o.y=r1(m.y); }
    else { const m=magnet(o,nx,ny,bw(o),bh(o)); o.x=r1(m.x); o.y=r1(m.y); }
  }else if(drag.type==='resize'){
    o.w=Math.max(100,r1(snapV(w.x-o.x))); o.l=Math.max(100,r1(snapV(w.y-o.y)));
  }else if(drag.type==='aim'){
    let a=Math.atan2(w.y-o.y,w.x-o.x)*180/Math.PI; a=(Math.round(a/5)*5+360)%360;
    o.angle=a; o.range=Math.max(500,r1(Math.round(Math.hypot(w.x-o.x,w.y-o.y)/100)*100));
  }
  renderPlan(); syncInspectorPos();
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(!drag) return;
  if(drag.moved){ save(); renderSummary(); syncInspectorPos(); updUndo(); }
  drag=null; svg.classList.remove('panning');
}
svg.addEventListener('pointerup',endPointer);
svg.addEventListener('pointercancel',endPointer);
svg.addEventListener('pointerleave',()=>{ if(!drag) $('#stPos').textContent='–'; });
svg.addEventListener('wheel',e=>{ e.preventDefault(); const p=local(e); zoomAt(p.x,p.y,Math.pow(1.0015,-e.deltaY)); },{passive:false});
svg.addEventListener('dblclick',e=>{ const t=e.target.closest('[data-id]'); if(t){ const n=$('#f-name'); if(n){ n.focus(); n.select(); } } });

   11) Commands
   ========================================================= */
function delSel(){ const o=sel?findAny(sel):null; if(!o) return; const n=o.name; mutate(()=>{ S.items=S.items.filter(i=>i.id!==sel); S.zones=S.zones.filter(z=>z.id!==sel); sel=null; }); toast(`ลบ ${n} แล้ว`); }
function dupSel(){
  const o=sel?findAny(sel):null; if(!o||isZone(o)) return;
  mutate(()=>{
    const c=clone(o); c.id=uid();
    if(isCam(c)){ c.name=nextName('cctv',S.items); c.x+=400; c.y+=400; }
    else{
      c.name=c.kind==='furn'?baseName(c.name.replace(/ \d+$/,''),S.items):nextName(c.kind,S.items);
      const right={x1:o.x+bw(o)+20,y1:o.y,x2:o.x+2*bw(o)+20,y2:o.y+bh(o)};
      if(right.x2<=S.shopW&&!solids().some(s=>ov(box(s),right))) c.x=right.x1; else c.y=o.y+bh(o)+20;
    }
    S.items.push(c); sel=c.id;
  });
}
function rotSel(){
  const o=sel?findAny(sel):null; if(!o||isZone(o)) return;
  mutate(()=>{ if(isCam(o)) o.angle=(o.angle+15)%360; else setRot(o,(o.rot+90)%360); });
}
function nudge(dx,dy){
  const o=sel?findAny(sel):null; if(!o) return; if(isZone(o)&&o.locked) return;
  mutate(()=>{ o.x=r1(o.x+dx); o.y=r1(o.y+dy); });
}
function setMode(m){
  mode=m; $('#tSelect').classList.toggle('on',m==='select'); $('#tMeasure').classList.toggle('on',m==='measure');
  svg.classList.toggle('measure',m==='measure');
  $('#stMode').textContent=m==='measure'?'โหมดวัดระยะ: ลากจากจุดหนึ่งไปอีกจุด (Shift = แนวตรง) · Esc เพื่อออก':'ลากเครื่องเพื่อย้าย · ลากพื้นที่ว่างเพื่อเลื่อนแบบ · ล้อเมาส์เพื่อซูม';
  if(m==='select'){ measure=null; renderPlan(); }
}

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(), typing=tag==='input'||tag==='textarea'||tag==='select';
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='s'){ e.preventDefault(); if(typing&&e.target.id==='planName') commitName(); saveProject({}); return; }
  if(!$('#modal').hidden){ if(e.key==='Escape') closeModal(); return; }
  if(e.key==='Escape'){ if(typing){ e.target.blur(); return; } if(mode==='measure') setMode('select'); else if(sel){ sel=null; renderAll(); } return; }
  if(typing) return;
  if(mod&&e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(mod&&e.key.toLowerCase()==='d'){ e.preventDefault(); dupSel(); return; }
  if(mod) return;
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); delSel(); return; }
  if(e.key==='r'||e.key==='R'){ rotSel(); return; }
  if(e.key==='m'||e.key==='M'){ setMode(mode==='measure'?'select':'measure'); return; }
  if(e.key==='v'||e.key==='V'){ setMode('select'); return; }
  if(e.key==='f'||e.key==='F'){ fit(); return; }
  const st=(S.snap>1?S.snap:10)*(e.shiftKey?10:1);
  const mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(mv&&sel){ e.preventDefault(); nudge(mv[0],mv[1]); }
});

/* =========================================================
   13) Project storage
   - คลาวด์ (db capability): projects/{id} = ข้อมูลสรุป, projectData/{id} = แบบเต็ม
     ทุกคนที่เปิดหน้านี้ได้เห็นรายการเดียวกัน, Contributor ขึ้นไปบันทึกได้
   - เบราว์เซอร์ (localStorage): ใช้เมื่อคลาวด์ไม่พร้อม/ไม่มีสิทธิ์เขียน
   ========================================================= */
const Cloud={db:null,user:null,myId:null,canWrite:null,writeDenied:false,metas:[],fromCache:true,unsub:null};
let tier='pending';                 // 'pending' | 'cloud' | 'local'
let cur={id:null,storage:null,rev:null,savedHash:null,savedAt:null,baseHash:null};
let remoteMeta=null, remoteDeleted=false, saveErr=null, savingNow=false;
const myRevs=new Set();
let autoOn=lsGet(AKEY)!=='0';

function content(st){ st=st||S; return {name:st.name,shopW:st.shopW,shopL:st.shopL,grid:st.grid,snap:st.snap,zones:st.zones,items:st.items}; }
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36)+':'+s.length; }
const contentHash=()=>hashStr(JSON.stringify(content()));
function dirty(){ const h=contentHash(); return cur.id?h!==cur.savedHash:h!==cur.baseHash; }
function persistCur(){ lsSet(CKEY,JSON.stringify(cur)); }
const cloudWritable=()=>!!Cloud.db&&Cloud.canWrite!==false&&!Cloud.writeDenied;
const defaultStorage=()=>cloudWritable()?'cloud':'local';

const Local={
  read(){ try{ const o=JSON.parse(lsGet(PKEY)||'{}'); return o&&typeof o==='object'?o:{}; }catch(e){ return {}; } },
  write(o){ return lsSet(PKEY,JSON.stringify(o)); }
};
function listOf(st){
  const arr=st==='cloud'?Cloud.metas.slice():Object.entries(Local.read()).map(([id,v])=>Object.assign({id},v&&v.meta||{}));
  return arr.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function retry1(fn){ try{ return await fn(); }catch(e){ if(e&&e.code==='unavailable'){ await sleep(500+Math.random()*700); return await fn(); } throw e; } }

async function storePut(st,id,meta,state){
  if(st==='cloud'){
    await retry1(()=>Cloud.db.doc('projectData/'+id).set({v:1,state}));
    await retry1(()=>Cloud.db.doc('projects/'+id).set(meta));
  }else{
    const o=Local.read(); o[id]={meta,state};
    if(!Local.write(o)) throw {code:'local_full'};
  }
}
async function storeGet(st,id){
  if(st==='cloud'){
    const snap=await retry1(()=>Cloud.db.doc('projectData/'+id).get());
    if(!snap.exists) return null; const d=snap.data(); return d&&d.state?clone(d.state):null;
  }
  const v=Local.read()[id]; return v&&v.state?clone(v.state):null;
}
async function storeDel(st,id){
  if(st==='cloud'){
    await retry1(()=>Cloud.db.doc('projects/'+id).delete());
    await retry1(()=>Cloud.db.doc('projectData/'+id).delete());
  }else{ const o=Local.read(); delete o[id]; Local.write(o); }
}
async function storeRename(st,id,name){
  const rev=uid(); myRevs.add(rev);
  if(st==='cloud'){
    await retry1(()=>Cloud.db.doc('projectData/'+id).update({state:{name}}));
    await retry1(()=>Cloud.db.doc('projects/'+id).update({name,rev}));
  }else{ const o=Local.read(); if(o[id]){ o[id].meta.name=name; o[id].meta.rev=rev; if(o[id].state) o[id].state.name=name; Local.write(o); } }
  return rev;
}
function makeMeta(st,state,prev,rev){
  const {c,pockets}=countsOf(state), now=new Date().toISOString();
  return {v:1,name:state.name||'ไม่มีชื่อ',shopW:state.shopW,shopL:state.shopL,counts:c,pockets,zones:state.zones.length,objects:state.items.length,
    updatedAt:now,updatedBy:Cloud.myId||null,createdAt:(prev&&prev.createdAt)||now,createdBy:prev?(prev.createdBy??null):(Cloud.myId||null),rev};
}

function errText(e){
  const c=e&&e.code;
  if(c==='invalid_argument') return 'ไม่มีสิทธิ์บันทึกโปรเจคบนคลาวด์ของหน้านี้ (ต้องเป็น Contributor ขึ้นไป)';
  if(c==='quota_exceeded') return 'พื้นที่จัดเก็บโปรเจคเต็ม ลบโปรเจคที่ไม่ใช้แล้วลองใหม่';
  if(c==='too_big') return 'โปรเจคนี้ใหญ่เกิน 240 KB บันทึกบนคลาวด์ไม่ได้ ลดจำนวนวัตถุหรือส่งออกเป็นไฟล์แทน';
  if(c==='local_full') return 'พื้นที่เก็บในเบราว์เซอร์เต็ม ลบโปรเจคเก่าหรือส่งออกเป็นไฟล์';
  if(c==='resource_exhausted') return 'บันทึกถี่เกินไป รอสักครู่แล้วลองใหม่';
  return 'บันทึกไม่สำเร็จ ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง';
}
function cloudLost(e){
  const c=e&&e.code;
  if(['revoked','not_granted','capability_disabled','capability_removed'].includes(c)){
    Cloud.db=null; tier='local'; if(Cloud.unsub){ try{Cloud.unsub();}catch(_){} Cloud.unsub=null; } return true;
  }
  return false;
}

let saving=null, saveQueued=false;
async function saveProject(o){
  o=o||{};
  if(o.auto&&tier==='pending') return;
  if(saving){ if(o.asNew){ await saving.catch(()=>{}); } else { saveQueued=true; return; } }
  let st=(!o.asNew&&cur.id)?cur.storage:defaultStorage();
  if(st==='cloud'&&!cloudWritable()){
    if(o.auto){ saveErr={code:'invalid_argument'}; updateStatus(); return; }   // ไม่ย้ายที่เก็บเองตอนบันทึกอัตโนมัติ
    st='local';
  }
  const reuse=!o.asNew&&cur.id&&cur.storage===st;
  const id=reuse?cur.id:('p'+uid()+uid().slice(0,4));
  if(o.name!==undefined){ S.name=o.name; lsSet(KEY,JSON.stringify(S)); syncHeader(); }
  const state=clone(S);
  if(st==='cloud'&&JSON.stringify(state).length>240000){ saveErr={code:'too_big'}; updateStatus(); toast(errText(saveErr),4000); return; }
  const prev=reuse?listOf(st).find(m=>m.id===id):null;
  const rev=uid(), meta=makeMeta(st,state,prev,rev), h=hashStr(JSON.stringify(content(state)));
  myRevs.add(rev); savingNow=true; saveErr=null; updateStatus();
  const run=(async()=>{
    await storePut(st,id,meta,state);
    const movedFrom=(cur.id&&cur.storage!==st&&!o.asNew)?cur.storage:null;
    cur={id,storage:st,rev,savedHash:h,savedAt:meta.updatedAt,baseHash:null};
    remoteMeta=null; remoteDeleted=false; hideBanner(); persistCur();
    return movedFrom;
  })();
  saving=run;
  try{
    const movedFrom=await run;
    if(!o.silent) toast(o.asNew?`บันทึกเป็นโปรเจคใหม่ “${meta.name}” แล้ว`:(movedFrom?'บันทึกลงเบราว์เซอร์นี้แล้ว (คลาวด์ไม่พร้อมหรือไม่มีสิทธิ์)':'บันทึกโปรเจคแล้ว'));
  }catch(e){
    saveErr=e||{}; if(st==='cloud'){ if(e&&e.code==='invalid_argument') Cloud.writeDenied=true; if(cloudLost(e)) toast('การเชื่อมต่อที่เก็บคลาวด์หยุดลง — กดบันทึกอีกครั้งเพื่อบันทึกลงเบราว์เซอร์',4500); }
    if(!o.auto||saveErr.code!=='unavailable') toast(errText(saveErr)+((st==='cloud'&&saveErr.code==='invalid_argument')?' — กดบันทึกอีกครั้งเพื่อบันทึกลงเบราว์เซอร์':''),4500);
  }finally{
    saving=null; savingNow=false; updateStatus(); renderProjects();
    if(saveQueued){ saveQueued=false; if(cur.id&&dirty()) saveProject({silent:true,auto:true}); }
  }
}

let autoT=null;
function scheduleAutosave(){
  clearTimeout(autoT);
  if(!autoOn||!cur.id||remoteMeta||remoteDeleted||tier==='pending') return;
  if(!dirty()) return;
  autoT=setTimeout(()=>{ if(cur.id&&dirty()&&!remoteMeta) saveProject({silent:true,auto:true}); },3000);
}
function onContentChanged(){ if(saveErr&&!savingNow&&!dirty()) saveErr=null; updateStatus(); scheduleAutosave(); }

function updateStatus(){
  const el=$('#saveState'); if(!el||!S) return;
  const d=dirty();
  let cls='', txt='';
  if(savingNow){ cls='busy'; txt='กำลังบันทึก…'; }
  else if(saveErr&&d){ cls='bad'; txt='✕ บันทึกไม่สำเร็จ'; }
  else if(!cur.id){ cls=d?'warn':''; txt=d?'● ยังไม่ได้บันทึกเป็นโปรเจค':'แบบร่าง (ยังไม่บันทึก)'; }
  else if(d){ cls='warn'; txt='● มีการแก้ไขที่ยังไม่บันทึก'; }
  else { cls='ok'; txt=`✓ บันทึกแล้ว ${fmtTime(cur.savedAt)}`; }
  const where=cur.id?(cur.storage==='cloud'?'คลาวด์ (ใช้ร่วมกัน)':'เบราว์เซอร์นี้')
    :(tier==='pending'?'กำลังเชื่อมต่อที่เก็บ…':(cloudWritable()?'จะบันทึกบนคลาวด์':'จะบันทึกในเบราว์เซอร์นี้'));
  el.className='state '+cls;
  el.innerHTML=`<span>${esc(txt)}</span><small>${esc(where)}</small>`;
  el.title=saveErr&&d?errText(saveErr):'';
}

/* ---------- banner (บันทึกจากที่อื่น / ถูกลบ) ---------- */
function showBanner(kind,m){
  const el=$('#banner');
  if(kind==='changed'){
    el.innerHTML=`<span class="t">โปรเจคนี้ถูกบันทึกจากที่อื่นเมื่อ ${esc(fmtTime(m.updatedAt))} <span id="bnWho"></span> ขณะที่คุณมีการแก้ไขที่ยังไม่บันทึก (บันทึกอัตโนมัติหยุดไว้ก่อน)</span>
      <button class="btn sm" type="button" data-bn="reload">โหลดเวอร์ชันล่าสุด (ทิ้งการแก้ไขของฉัน)</button>
      <button class="btn sm" type="button" data-bn="overwrite">บันทึกทับด้วยเวอร์ชันของฉัน</button>
      <button class="btn sm" type="button" data-bn="saveas">บันทึกของฉันเป็นโปรเจคใหม่</button>`;
    whoInto($('#bnWho'),m.updatedBy,'โดย ');
  }else{
    el.innerHTML=`<span class="t">โปรเจคที่เปิดอยู่ถูกลบจากที่อื่นแล้ว แบบบนหน้าจอยังอยู่ครบ</span>
      <button class="btn sm" type="button" data-bn="keep">บันทึกเก็บไว้เป็นโปรเจคใหม่</button>
      <button class="btn sm" type="button" data-bn="dismiss">ปิด</button>`;
  }
  el.hidden=false;
}
function hideBanner(){ const el=$('#banner'); el.hidden=true; el.innerHTML=''; }
$('#banner').addEventListener('click',async e=>{
  const b=e.target.closest('[data-bn]'); if(!b) return; const a=b.dataset.bn;
  if(a==='reload'&&remoteMeta){ await openProject('cloud',remoteMeta.id,{force:true}); }
  else if(a==='overwrite'&&remoteMeta){ myRevs.add(remoteMeta.rev); remoteMeta=null; hideBanner(); await saveProject({}); }
  else if(a==='saveas'){ if(remoteMeta) myRevs.add(remoteMeta.rev); remoteMeta=null; hideBanner(); await saveProject({asNew:true,name:(S.name||'โปรเจค')+' (ของฉัน)'}); }
  else if(a==='keep'){ remoteDeleted=false; hideBanner(); await saveProject({asNew:true}); }
  else if(a==='dismiss'){ remoteDeleted=false; hideBanner(); }
});

async function whoInto(el,id,prefix){
  if(!el||!id||!Cloud.user) return;

/* ---------- cloud init + live list ---------- */
async function initCloud(){
  const c=window.claude;
  if(!c||typeof c.use!=='function'){ tier='local'; afterTier(); return; }
  let db=null; try{ db=await c.use('db'); }catch(e){ db=null; }
  if(!db){ tier='local'; afterTier(); return; }
  Cloud.db=db;
  try{ Cloud.user=await c.use('user'); }catch(e){ Cloud.user=null; }
  if(Cloud.user){
    try{ Cloud.myId=await Cloud.user.id(); }catch(e){}
    try{ Cloud.canWrite=await Cloud.user.can('data.write'); }catch(e){}
  }
  tier='cloud';
  try{
    Cloud.unsub=db.collection('projects').onSnapshot(snap=>{
      Cloud.metas=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));
      Cloud.fromCache=!!(snap.metadata&&snap.metadata.fromCache);
      onCloudList();
    },err=>{
      Cloud.db=null; Cloud.unsub=null; tier='local'; updateStatus(); renderProjects();
      if(!(err&&err.code==='revoked')) toast('เชื่อมต่อรายการโปรเจคบนคลาวด์ไม่ได้ — บันทึกในเบราว์เซอร์แทน',4500);
    });
  }catch(e){ Cloud.db=null; tier='local'; }
  afterTier();
}
function afterTier(){
  if(cur.storage==='cloud'&&tier==='local') { /* เปิดนอก claude.ai: ใช้ working copy ต่อ บันทึกครั้งหน้าจะลงเบราว์เซอร์ */ }
  updateStatus(); renderProjects(); scheduleAutosave();
}
function onCloudList(){
  if(cur.id&&cur.storage==='cloud'&&!savingNow){
    const m=Cloud.metas.find(x=>x.id===cur.id);
    if(!m){
      if(!Cloud.fromCache&&!remoteDeleted){ remoteDeleted=true; remoteMeta=null; cur={id:null,storage:null,rev:null,savedHash:null,savedAt:null,baseHash:null}; persistCur(); showBanner('deleted'); }
    }else if(m.rev&&!myRevs.has(m.rev)){
      if(!dirty()){ openProject('cloud',m.id,{force:true,quiet:true}).then(ok=>{ if(ok) toast('โหลดเวอร์ชันล่าสุดของโปรเจคที่บันทึกจากที่อื่นแล้ว',3500); }); }
      else if(!remoteMeta||remoteMeta.rev!==m.rev){ remoteMeta=m; clearTimeout(autoT); showBanner('changed',m); }
    }
  }
  updateStatus(); renderProjects();
}

/* ---------- open / new / import ---------- */
let opening=false;
async function openProject(st,id,o){
  o=o||{};
  if(opening) return false; opening=true;
  try{
    if(st==='cloud'&&!Cloud.db){ toast('ที่เก็บคลาวด์ไม่พร้อมในขณะนี้'); return false; }
    const state=await storeGet(st,id);
    if(!state||!valid(state)){ toast('เปิดโปรเจคไม่ได้: ไม่พบข้อมูลแบบของโปรเจคนี้',3500); return false; }
    const m=listOf(st).find(x=>x.id===id);
    loadState(normalize(state));
    cur={id,storage:st,rev:(m&&m.rev)||null,savedHash:contentHash(),savedAt:(m&&m.updatedAt)||null,baseHash:null};
    if(cur.rev) myRevs.add(cur.rev);
    remoteMeta=null; remoteDeleted=false; saveErr=null; hideBanner(); persistCur(); updateStatus(); renderProjects();
    if(!o.quiet) toast(`เปิดโปรเจค “${S.name}” แล้ว`);
    return true;
  }catch(e){
    if(st==='cloud') cloudLost(e);
    toast('เปิดโปรเจคไม่สำเร็จ ลองอีกครั้ง',3500); return false;
  }finally{ opening=false; }
}
function loadState(st){
  S=st; sel=null; measure=null; hist=[]; redoStack=[];
  lsSet(KEY,JSON.stringify(S)); syncHeader(); renderAll(); fit();
}
function startDraft(st,msg){
  loadState(st);
  cur={id:null,storage:null,rev:null,savedHash:null,savedAt:null,baseHash:contentHash()};
  remoteMeta=null; remoteDeleted=false; saveErr=null; hideBanner(); persistCur(); updateStatus(); renderProjects();
  if(msg) toast(msg);
}

function projRow(m,st){
  const isCur=cur.id===m.id&&cur.storage===st;
  const c=m.counts||{};
  const ren=pmState.renaming&&pmState.renaming.id===m.id&&pmState.renaming.st===st;
  const armed=pmState.delArm&&pmState.delArm.id===m.id&&pmState.delArm.st===st;
  const busy=pmState.busy===st+':'+m.id;
  const name=ren?`<div class="pm-row"><input type="text" id="pmRename" value="${esc(m.name||'')}" aria-label="ชื่อใหม่"><button class="btn sm primary" type="button" data-pa="renameok">ตกลง</button><button class="btn sm" type="button" data-pa="renamecancel">ยกเลิก</button></div>`
    :`<div class="pname">${esc(m.name||'ไม่มีชื่อ')}${isCur?'<span class="tag">เปิดอยู่</span>':''}</div>`;
  const meta=`${m.shopW?dimsShort(m.shopW,m.shopL)+' cm':''} · ซัก ${c.washer||0} · อบ ${c.dryer||0}${c.stack?` · Stack ${c.stack}`:''} · ถัง ${m.pockets||0} · CCTV ${c.cctv||0}`;
  const who=`บันทึก ${esc(fmtTime(m.updatedAt))} <span data-uid="${esc(m.updatedBy||'')}"></span>`;
  const acts=ren?'':`<button class="btn sm" type="button" data-pa="open" ${busy?'disabled':''}>${isCur?'เปิดใหม่':'เปิด'}</button>
    <button class="btn sm" type="button" data-pa="rename">เปลี่ยนชื่อ</button>
    <button class="btn sm" type="button" data-pa="dup">ทำสำเนา</button>
    ${st==='local'&&cloudWritable()?'<button class="btn sm" type="button" data-pa="upload">ย้ายขึ้นคลาวด์</button>':''}
    <button class="btn sm danger ${armed?'armed':''}" type="button" data-pa="del">${armed?'ยืนยันลบ':'ลบ'}</button>`;
  return `<li class="${isCur?'cur':''}" data-pid="${esc(m.id)}" data-st="${st}">${name}<div class="pacts">${acts}</div><div class="pmeta">${meta}</div><div class="pwho">${who}</div></li>`;
}
function renderProjects(){
  renderTierNote();
  const el=$('#pmList'); if(!el) return;
  const qEl=$('#pmSearch'), q=(qEl?qEl.value:'').trim().toLowerCase();
  const filt=a=>q?a.filter(m=>String(m.name||'').toLowerCase().includes(q)):a;
  const secs=[];
  if(tier==='cloud'&&Cloud.db) secs.push({st:'cloud',title:'โปรเจคบนคลาวด์',items:filt(listOf('cloud'))});
  const loc=listOf('local');
  if(tier!=='cloud'||loc.length) secs.push({st:'local',title:tier==='cloud'?'โปรเจคในเบราว์เซอร์นี้':'โปรเจคที่บันทึกไว้',items:filt(loc)});
  let h='';
  secs.forEach(sc=>{
    h+=`<div class="eyebrow" style="margin:6px 0">${sc.title} (${sc.items.length})</div>`;
    if(!sc.items.length) h+=`<div class="pempty">${q?'ไม่พบโปรเจคที่ตรงกับคำค้น':(sc.st==='cloud'&&Cloud.fromCache?'กำลังโหลดรายการ…':'ยังไม่มีโปรเจค — กด “บันทึก” เพื่อเก็บแบบปัจจุบันเป็นโปรเจคแรก')}</div>`;
    else h+=`<ul class="plist">${sc.items.map(m=>projRow(m,sc.st)).join('')}</ul>`;
  });
  el.innerHTML=h;
  if(Cloud.user){
    const spans=[...el.querySelectorAll('[data-uid]')].filter(s=>s.dataset.uid);
    const ids=[...new Set(spans.map(s=>s.dataset.uid))];
    if(ids.length) Cloud.user.profiles(ids).then(ps=>{ spans.forEach(s=>{ const p=ps&&ps[s.dataset.uid]; if(p&&p.name) s.textContent='โดย '+(p.isMe?'คุณ':p.name); }); }).catch(()=>{});
  }
  const rn=$('#pmRename'); if(rn&&document.activeElement!==rn){ rn.focus(); rn.select(); }
}

$('#modal').addEventListener('input',e=>{ if(e.target.id==='pmSearch') renderProjects(); });
$('#modal').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='pmRename'){ e.preventDefault(); const b=$('[data-pa="renameok"]'); if(b) b.click(); }
  if(e.target.id==='pmNewName'){ e.preventDefault(); const b=$('[data-pm="saveasok"]'); if(b) b.click(); }
